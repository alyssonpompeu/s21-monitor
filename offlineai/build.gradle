plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.alysson.offlineai'
    compileSdk 36

    defaultConfig {
        // Separate package so the 2B variant can be installed alongside the 0.8B build.
        applicationId 'com.alysson.offlineai.qwen2b'
        minSdk 31
        targetSdk 35
        versionCode 3
        versionName '2.0.0-qwen2b'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    androidResources {
        noCompress += ['gguf']
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation project(':llamalib')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    // Bundled Latin OCR model: works locally without downloading a model at runtime.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
