plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.alysson.offlineai'
    compileSdk 36

    defaultConfig {
        // V5.1 is a separate package so v5 remains available while the builder install path is corrected.
        applicationId 'com.alysson.offlineai.pluginv51'
        minSdk 31
        targetSdk 35
        versionCode 9
        versionName '6.1.0-plugin-v5.1-builder-fix'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    androidResources {
        noCompress += ['gguf', 'iapack']
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation project(':llamalib')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.android.tools.build:apksig:8.13.2'
    implementation 'androidx.documentfile:documentfile:1.1.0'
}
