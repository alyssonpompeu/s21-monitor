plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alysson.applecontrol'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alysson.applecontrol'
        minSdk 29
        targetSdk 35
        versionCode 11
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
