plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alysson.internetchat'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alysson.internetchat'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
