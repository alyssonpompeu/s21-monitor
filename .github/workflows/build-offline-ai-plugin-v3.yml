name: Build Offline AI Plugin Platform v3

on:
  workflow_dispatch:
  push:
    branches: [ "feature/offline-ptbr-ai-plugin-platform-v3" ]
    paths-ignore:
      - 'offlineai-plugin-v3-last-successful-build.txt'

permissions:
  contents: write

jobs:
  build-plugin-platform-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 210

    env:
      LLAMA_CPP_COMMIT: 153d324bcf86d220b235ca010eeb11213f32b5d1
      SD_CPP_COMMIT: bcc7e29568b94a25f78e99d34a8fa048d77536b1
      LEXICON_SHA256: 2eb81afe3ea215dfea59890021e8cebb9f3b71a80fe6a56dfb29f84e2870b0db
      DICTIONARY_PDF_SHA256: acf31020fd2b217d0fde0f47fc1f6d75d747ed224d173ade4539e35ff047caf7
      QWEN_MODEL_REVISION: 31e04817b38d226cdd13454bcc3982ebaa5a386b
      QWEN_MODEL_SHA256: aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223
      QWEN_MODEL_FILE: Qwen3.5-2B-Q4_K_M.gguf
      CODER_MODEL_FILE: qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
      CODER_MODEL_SHA256: cc324af070c2ecbfd324a30884d2f951a7ff756aba85cb811a6ec436933bb046
      LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz
      LLVM_MINGW_SHA256: 534b92e067b22a6b4441f48ae9240a3341b17825d04d577eab0cf85c44b4deda

    steps:
      - name: Checkout Plugin Platform v3
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android and build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils openssl xz-utils file
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Pin llama.cpp source
        shell: bash
        run: |
          rm -rf vendor/llama.cpp
          git clone https://github.com/ggml-org/llama.cpp.git vendor/llama.cpp
          git -C vendor/llama.cpp checkout "$LLAMA_CPP_COMMIT"
          git -C vendor/llama.cpp submodule update --init --recursive

      - name: Tune Qwen runtime for S21 headroom
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          native = Path('vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp')
          text = native.read_text(encoding='utf-8')
          replacements = {
              'constexpr int   N_THREADS_MAX           = 4;': 'constexpr int   N_THREADS_MAX           = 3;',
              'constexpr int   DEFAULT_CONTEXT_SIZE    = 8192;': 'constexpr int   DEFAULT_CONTEXT_SIZE    = 4096;',
              'constexpr int   BATCH_SIZE              = 512;': 'constexpr int   BATCH_SIZE              = 128;',
              'constexpr float DEFAULT_SAMPLER_TEMP    = 0.3f;': 'constexpr float DEFAULT_SAMPLER_TEMP    = 0.75f;',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Pinned ai_chat.cpp no longer matches expected point: {old}')
              text = text.replace(old, new, 1)
          native.write_text(text, encoding='utf-8')

          activity = Path('offlineai/src/main/java/com/alysson/offlineai/MainActivity.kt')
          app = activity.read_text(encoding='utf-8')
          markers = {
              'Qwen3.5-0.8B-Q4_K_M.gguf': 'Qwen3.5-2B-Q4_K_M.gguf',
              'bd258782e35f7f458f8aced1adc053e6e92e89bc735ba3be89d38a06121dc517': 'aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223',
          }
          for old, new in markers.items():
              if old not in app:
                  raise SystemExit(f'MainActivity model marker missing: {old}')
              app = app.replace(old, new, 1)
          activity.write_text(app, encoding='utf-8')
          PY

      - name: Apply Workspace v2 and Plugin v3 UI patches
        shell: bash
        run: |
          python3 scripts/apply_workspace_v2_ui.py
          python3 scripts/apply_workspace_v3.py

      - name: Build stable-diffusion.cpp ARM64 without OpenMP
        shell: bash
        run: |
          rm -rf vendor/stable-diffusion.cpp build/sd-android
          git clone https://github.com/leejet/stable-diffusion.cpp.git vendor/stable-diffusion.cpp
          git -C vendor/stable-diffusion.cpp checkout "$SD_CPP_COMMIT"
          git -C vendor/stable-diffusion.cpp submodule update --init --recursive
          CMAKE="$ANDROID_HOME/cmake/3.31.6/bin/cmake"
          NINJA="$ANDROID_HOME/cmake/3.31.6/bin/ninja"
          TOOLCHAIN="$ANDROID_HOME/ndk/29.0.13113456/build/cmake/android.toolchain.cmake"
          READELF="$ANDROID_HOME/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$CMAKE" -S vendor/stable-diffusion.cpp -B build/sd-android -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$NINJA" \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DSD_BUILD_EXAMPLES=ON \
            -DSD_WEBP=OFF -DSD_WEBM=OFF \
            -DSD_CUDA=OFF -DSD_HIPBLAS=OFF -DSD_METAL=OFF \
            -DSD_VULKAN=OFF -DSD_OPENCL=OFF -DSD_SYCL=OFF \
            -DSD_BUILD_SHARED_LIBS=OFF -DSD_BUILD_SHARED_GGML_LIB=OFF \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF
          "$CMAKE" --build build/sd-android --target sd-cli -- -j2
          SD_CLI="$(find build/sd-android -type f -name sd-cli -perm -111 | head -n 1)"
          test -n "$SD_CLI"
          "$READELF" -d "$SD_CLI" | tee build/sd-cli-needed.txt
          if grep -q 'libomp.so' build/sd-cli-needed.txt; then
            echo 'ERROR: image engine still depends on libomp.so' >&2
            exit 1
          fi
          mkdir -p offlineai/src/main/jniLibs/arm64-v8a
          cp "$SD_CLI" offlineai/src/main/jniLibs/arm64-v8a/libsd-cli.so
          chmod 755 offlineai/src/main/jniLibs/arm64-v8a/libsd-cli.so

      - name: Create first-party plugin signing identity
        shell: bash
        run: |
          mkdir -p build/plugin-signing offlineai/src/main/assets build/devpack/payload/signing
          openssl genpkey -algorithm ED25519 -out build/plugin-signing/plugin-ed25519.pem
          openssl pkey -in build/plugin-signing/plugin-ed25519.pem -pubout -outform DER \
            -out offlineai/src/main/assets/plugin_pubkey.der

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out build/plugin-signing/builder-rsa.pem
          openssl req -new -x509 -sha256 -days 3650 \
            -key build/plugin-signing/builder-rsa.pem \
            -subj '/CN=IA Offline Local Builder v3/O=Local Device/' \
            -out build/plugin-signing/builder-cert.pem
          openssl pkcs8 -topk8 -nocrypt \
            -in build/plugin-signing/builder-rsa.pem -outform DER \
            -out build/devpack/payload/signing/builder-key.pk8
          openssl x509 -in build/plugin-signing/builder-cert.pem -outform DER \
            -out build/devpack/payload/signing/builder-cert.der

      - name: Build four optimized Android APK shells
        shell: bash
        run: |
          gradle :appshell:assembleRelease --no-daemon
          mkdir -p build/devpack/payload/android
          for SLOT in 1 2 3 4; do
            APK="$(find appshell/build/outputs/apk -type f -iname "*slot${SLOT}*release*.apk" | head -n 1)"
            test -n "$APK"
            cp "$APK" "build/devpack/payload/android/slot${SLOT}.apk"
            unzip -l "$APK" | grep -q 'assets/index.html'
          done
          ls -lh build/devpack/payload/android/*.apk

      - name: Build native Windows x64 and ARM64 shells
        shell: bash
        run: |
          mkdir -p build/llvm-mingw build/devpack/payload/windows
          curl -L --fail --retry 5 --retry-delay 5 "$LLVM_MINGW_URL" -o build/llvm-mingw.tar.xz
          echo "$LLVM_MINGW_SHA256  build/llvm-mingw.tar.xz" | sha256sum -c -
          tar -xJf build/llvm-mingw.tar.xz -C build/llvm-mingw --strip-components=1
          X64=build/llvm-mingw/bin/x86_64-w64-mingw32-clang
          ARM64=build/llvm-mingw/bin/aarch64-w64-mingw32-clang
          COMMON='-std=c11 -Os -static -s -ffunction-sections -fdata-sections -Wl,--gc-sections -municode -mwindows'
          $X64 builder-shells/windows/app_shell.c $COMMON \
            -o build/devpack/payload/windows/app-shell-x64.exe -luser32 -lgdi32
          $ARM64 builder-shells/windows/app_shell.c $COMMON \
            -o build/devpack/payload/windows/app-shell-arm64.exe -luser32 -lgdi32
          file build/devpack/payload/windows/*.exe
          ls -lh build/devpack/payload/windows/*.exe

      - name: Create signed Developer Builder Core iapack
        shell: bash
        run: |
          mkdir -p build/devpack/payload/ui build/devpack/payload/optimizer
          cat > build/devpack/payload/ui/format.txt <<'EOF'
          Android: HTML/CSS/JS local em um arquivo, sem rede. Windows: IASPEC limitado a controles nativos suportados.
          EOF
          cat > build/devpack/payload/optimizer/rules.json <<'EOF'
          {"version":1,"mobile":{"max_generated_files":12,"max_html_kib":384,"no_remote_dependencies":true,"prefer_standard_library":true,"avoid_background_workers":true},"windows":{"max_controls":48,"shell":"win32-native"}}
          EOF
          python3 scripts/make_iapack.py \
            --root build/devpack \
            --id dev.builder.core \
            --name 'Developer Builder Core' \
            --version '1.0.0' \
            --type 'builder-core' \
            --description 'Builder local leve: APK Android em 4 slots, EXE Windows x64/ARM64, prévia de UI e regras de otimização.' \
            --key build/plugin-signing/plugin-ed25519.pem \
            --output Developer-Builder-Core-v1.iapack
          sha256sum Developer-Builder-Core-v1.iapack | tee Developer-Builder-Core-v1.iapack.sha256
          ls -lh Developer-Builder-Core-v1.iapack

      - name: Download and verify linguistic sources
        shell: bash
        run: |
          mkdir -p build/offline-sources offlineai/src/main/assets
          curl -L --fail --retry 5 https://www.ime.usp.br/~pf/dicios/br-sem-acentos.txt \
            -o build/offline-sources/br-sem-acentos.txt
          echo "$LEXICON_SHA256  build/offline-sources/br-sem-acentos.txt" | sha256sum -c -
          curl -L --fail --retry 5 https://www.gutenberg.org/files/31552/31552-pdf.pdf \
            -o build/offline-sources/31552-pdf.pdf
          echo "$DICTIONARY_PDF_SHA256  build/offline-sources/31552-pdf.pdf" | sha256sum -c -
          pdftotext -layout -enc UTF-8 build/offline-sources/31552-pdf.pdf build/offline-sources/dicionario.txt
          python3 scripts/build_ptbr_memory.py \
            --lexicon build/offline-sources/br-sem-acentos.txt \
            --dictionary build/offline-sources/dicionario.txt \
            --output offlineai/src/main/assets/ptbr_memory.db

      - name: Download and verify main Qwen3.5 2B
        shell: bash
        run: |
          curl -L --fail --retry 5 --retry-delay 5 \
            "https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/${QWEN_MODEL_REVISION}/${QWEN_MODEL_FILE}?download=true" \
            -o offlineai/src/main/assets/model.gguf
          echo "$QWEN_MODEL_SHA256  offlineai/src/main/assets/model.gguf" | sha256sum -c -
          ls -lh offlineai/src/main/assets/model.gguf

      - name: Record Plugin v3 source manifest
        shell: bash
        run: |
          cat > offlineai/src/main/assets/source_manifest.json <<EOF
          {
            "variant": "plugin-platform-v3",
            "language": "pt-BR",
            "runtime": "llama.cpp",
            "llama_cpp_commit": "$LLAMA_CPP_COMMIT",
            "runtime_policy": "CPU-only ARM64; max 3 llama workers; context 4096; batch 128; Vulkan off; separate-model switching; RAM and thermal admission control",
            "main_model": "$QWEN_MODEL_FILE",
            "main_model_sha256": "$QWEN_MODEL_SHA256",
            "plugin_format": "iapack-v1-ed25519-sha256",
            "builder_core": "precompiled Android WebView shells + native Win32 x64/ARM64 shells; no full compiler toolchain on device",
            "coder_pack": "$CODER_MODEL_FILE",
            "coder_pack_sha256": "$CODER_MODEL_SHA256",
            "image_runtime": "stable-diffusion.cpp CPU-only without OpenMP",
            "features": ["signed plugins", "Android APK builder", "Windows EXE builder", "UI preview", "source ZIP", "coder model switching", "resource guard"]
          }
          EOF

      - name: Build installable Plugin Platform v3 APK
        id: build_apk
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle :offlineai:assembleDebug --stacktrace --no-daemon 2>&1 | tee offlineai-plugin-v3-build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path('offlineai-plugin-v3-build.log').read_text(encoding='utf-8', errors='replace').splitlines()
          patterns = re.compile(r'(error:|fatal error:|CMake Error|FAILED:|ninja:|Execution failed|BUILD FAILED|What went wrong|Caused by:)')
          hits = [i for i, line in enumerate(src) if patterns.search(line)]
          selected = set()
          for i in hits:
              selected.update(range(max(0, i - 14), min(len(src), i + 38)))
          lines = [src[i] for i in sorted(selected)] or src[-700:]
          Path('offlineai-plugin-v3-last-build-error.txt').write_text('\n'.join(lines[-1200:]) + '\n', encoding='utf-8')
          PY
            cat offlineai-plugin-v3-last-build-error.txt
            exit "$STATUS"
          fi
          cp offlineai/build/outputs/apk/debug/offlineai-debug.apk IA-Offline-Plugin-v3-S21.apk
          sha256sum IA-Offline-Plugin-v3-S21.apk | tee IA-Offline-Plugin-v3-S21.apk.sha256
          unzip -l IA-Offline-Plugin-v3-S21.apk | grep -E 'assets/plugin_pubkey.der|assets/model.gguf|lib/arm64-v8a/libsd-cli.so'
          ls -lh IA-Offline-Plugin-v3-S21.apk

      - name: Download official Qwen2.5 Coder 1.5B Q4_K_M
        shell: bash
        run: |
          mkdir -p build/coderpack/payload
          curl -L --fail --retry 5 --retry-delay 5 \
            "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/${CODER_MODEL_FILE}?download=true" \
            -o build/coderpack/payload/coder.gguf
          echo "$CODER_MODEL_SHA256  build/coderpack/payload/coder.gguf" | sha256sum -c -
          ls -lh build/coderpack/payload/coder.gguf

      - name: Create signed Coder iapack
        shell: bash
        run: |
          python3 scripts/make_iapack.py \
            --root build/coderpack \
            --id coder.qwen25.1_5b \
            --name 'Qwen2.5 Coder 1.5B Q4_K_M' \
            --version '1.0.0' \
            --type 'coder-model' \
            --description 'Modelo especializado em programação. O Builder descarrega o modelo geral antes de carregá-lo para preservar RAM.' \
            --key build/plugin-signing/plugin-ed25519.pem \
            --output Coder-Qwen2.5-1.5B-Q4KM.iapack
          sha256sum Coder-Qwen2.5-1.5B-Q4KM.iapack | tee Coder-Qwen2.5-1.5B-Q4KM.iapack.sha256
          ls -lh Coder-Qwen2.5-1.5B-Q4KM.iapack

      - name: Upload v3 build diagnostics
        if: failure() && steps.build_apk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: offline-ai-plugin-v3-build-diagnostics
          path: |
            offlineai-plugin-v3-last-build-error.txt
            offlineai-plugin-v3-build.log
          retention-days: 7

      - name: Upload Plugin v3 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IA-Offline-Plugin-v3-S21-APK
          path: |
            IA-Offline-Plugin-v3-S21.apk
            IA-Offline-Plugin-v3-S21.apk.sha256
          compression-level: 0

      - name: Upload Developer Builder Core pack
        uses: actions/upload-artifact@v4
        with:
          name: Developer-Builder-Core-v1
          path: |
            Developer-Builder-Core-v1.iapack
            Developer-Builder-Core-v1.iapack.sha256
          compression-level: 0

      - name: Upload Coder pack
        uses: actions/upload-artifact@v4
        with:
          name: Coder-Qwen2.5-1.5B-Q4KM
          path: |
            Coder-Qwen2.5-1.5B-Q4KM.iapack
            Coder-Qwen2.5-1.5B-Q4KM.iapack.sha256
          compression-level: 0

      - name: Publish Plugin Platform v3 and packs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: offline-ai-plugin-platform-v3
          name: IA Offline Plugin Platform v3 para Galaxy S21
          body: |
            Edição experimental separada da Workspace v2 para permitir rollback imediato.

            - Plataforma `.iapack` com assinatura Ed25519 e SHA-256 por arquivo.
            - Developer Builder Core: cria APK Android em quatro slots reutilizando shells offline pré-compilados e cria executáveis Windows x64/ARM64 com interface nativa compacta.
            - Preview local antes de exportar APK/EXE e exportação de projeto de código em ZIP.
            - Coder Pack opcional Qwen2.5-Coder 1.5B Q4_K_M; o app mantém somente um modelo grande carregado por vez.
            - Qwen3.5 2B geral, Tiny-SD separado, proteção de RAM/temperatura, CPU ARM64 e Vulkan desligado permanecem.
            - O Builder Core deliberadamente NÃO instala um toolchain Android/LLVM completo no S21: usa shells compilados no CI para reduzir armazenamento, RAM e aquecimento.
            - APKs gerados são assinados localmente com uma chave de desenvolvimento contida no Builder Core; a rota de re-assinatura no Android é experimental até validação física no S21.
            - EXEs gerados são aplicações Windows reais baseadas em shell Win32 e um DSL limitado; para código Windows arbitrário, exporte o ZIP de fontes e compile em toolchain completo fora do celular.

            Instalação sugerida: APK v3 -> Developer Builder Core -> Coder Pack opcional. O Tiny-SD pode ser reutilizado do arquivo já baixado e importado na v3.
          files: |
            IA-Offline-Plugin-v3-S21.apk
            IA-Offline-Plugin-v3-S21.apk.sha256
            Developer-Builder-Core-v1.iapack
            Developer-Builder-Core-v1.iapack.sha256
            Coder-Qwen2.5-1.5B-Q4KM.iapack
            Coder-Qwen2.5-1.5B-Q4KM.iapack.sha256
          make_latest: false
          overwrite_files: true

      - name: Record successful Plugin v3 workflow run
        shell: bash
        run: |
          printf 'run_id=%s\ncommit=%s\ncompleted_utc=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > offlineai-plugin-v3-last-successful-build.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offlineai-plugin-v3-last-successful-build.txt
          git commit -m 'Record Plugin Platform v3 APK build [skip ci]' || exit 0
          git push origin HEAD:feature/offline-ptbr-ai-plugin-platform-v3
