name: Build Internet Chat APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'chat/**'
      - 'settings.gradle'
      - '.github/workflows/build-chat-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and record result
        run: |
          set +e
          gradle :chat:assembleDebug --stacktrace > chat-build.log 2>&1
          code=$?
          git pull --rebase origin main || true
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "exit_code=${code}"
            echo "--- build log tail ---"
            tail -n 80 chat-build.log
          } > chat-last-build.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat-last-build.txt
          git commit -m "Record internet chat APK build [skip ci]" || true
          git push || true
          exit $code

      - name: Rename APK
        run: cp chat/build/outputs/apk/debug/chat-debug.apk Conversa-Internet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Conversa-Internet-APK
          path: Conversa-Internet.apk

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chat-latest
          name: Conversa Internet - APK
          body: APK Android de mensagens de texto com cadastro/login e conversas pela internet.
          files: Conversa-Internet.apk
          make_latest: false
          overwrite_files: true
