name: Build G533 RF Finder APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'g533rf/**'
      - 'settings.gradle'
      - '.github/workflows/build-g533rf-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build G533 RF Finder debug APK
        run: gradle :g533rf:assembleDebug --stacktrace
      - name: Rename APK
        run: cp g533rf/build/outputs/apk/debug/g533rf-debug.apk G533-RF-Finder-S21.apk
      - uses: actions/upload-artifact@v4
        with:
          name: G533-RF-Finder-S21-APK
          path: G533-RF-Finder-S21.apk
      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: g533-rf-finder-latest
          name: G533 RF Finder S21 - Latest
          body: Experimental passive RF correlation tool for Logitech G533 (2403.35–2477.35 MHz) on rooted Galaxy S21.
          files: G533-RF-Finder-S21.apk
          make_latest: false
          overwrite_files: true
