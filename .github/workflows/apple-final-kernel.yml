name: Build APPLE FINAL Kernel

on:
  workflow_dispatch:
  push:
    branches: [ apple-final-kernel-build ]
    paths:
      - 'apple-final/**'
      - '.github/workflows/apple-final-kernel.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apple-final/**'
      - '.github/workflows/apple-final-kernel.yml'

concurrency:
  group: apple-final-kernel-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex git libelf-dev libssl-dev python3 rsync unzip xz-utils

      - name: Build APPLE FINAL
        shell: bash
        run: |
          set -o pipefail
          bash apple-final/build_apple_final.sh 2>&1 | tee APPLE_FINAL_CI.log

      - name: Upload APPLE FINAL diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APPLE-FINAL-DIAGNOSTICS
          path: |
            APPLE_FINAL_CI.log
            APPLE_FINAL_BUILD.tar.gz
            out/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APPLE FINAL build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APPLE-FINAL-KERNEL-BUILD
          path: APPLE_FINAL_BUILD.tar.gz
          if-no-files-found: error
          retention-days: 7
