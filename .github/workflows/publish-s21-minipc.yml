name: Publish S21 MiniPC G991B APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "S21_MINIPC_PUBLISH_TRIGGER.txt"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download validated APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          gh run download 32104432591 \
            --repo alyssonpompeu/s21-monitor \
            --name S21-MiniPC-G991B-v0.1 \
            --dir dist
          ls -lh dist
          test -f dist/S21-MiniPC-G991B-v0.1.apk
          test -f dist/SHA256SUMS.txt
          sha256sum -c dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          TAG="s21-minipc-v0.1-test"
          if gh release view "$TAG" --repo alyssonpompeu/s21-monitor >/dev/null 2>&1; then
            gh release delete "$TAG" --repo alyssonpompeu/s21-monitor --yes --cleanup-tag
          fi
          gh release create "$TAG" dist/* \
            --repo alyssonpompeu/s21-monitor \
            --target main \
            --title "S21 MiniPC v0.1 - G991B Test" \
            --notes "Experimental test build for Samsung Galaxy S21 SM-G991B / Exynos 2100 / Mali-G78 MP14. ARM64 only. Runtime based on the open-source WinlatorMali bionic branch with a G991B test profile: 1280x720 default desktop, FPS overlay enabled for new containers, Intermediate Box64 fallback, aggressive/minimal startup profile, FEXCore default and Mali graphics runtime. Normal use does not require ADB or Termux."
