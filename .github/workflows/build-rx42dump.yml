name: Build RX42 S21 Firmware Dump APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'rx42dump/**'
      - 'bcm4375lab/**'
      - 'settings.gradle'
      - '.github/workflows/build-rx42dump.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'rx42dump/**'
      - 'bcm4375lab/**'
      - 'settings.gradle'
      - '.github/workflows/build-rx42dump.yml'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Nexmon build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y git gawk qpdf flex libfl-dev bison xxd make patch python3 zlib1g-dev \
            libc6:i386 libstdc++6:i386 zlib1g:i386 libncurses5:i386

      - name: Clone exact PR663 and add read-only IOCTL 0x630
        run: |
          git clone --depth 1 https://github.com/seemoo-lab/nexmon.git /tmp/nexmon-sdr
          cd /tmp/nexmon-sdr
          git fetch --depth 1 origin pull/663/head:pr663
          git checkout pr663
          test "$(git rev-parse HEAD)" = "fd117f434e1c479f6819a0ba31f9ca82d75f8a3a"
          sed -i 's/LDFLAGS[[:space:]]*+=[[:space:]]*-ll/LDFLAGS\t\t+= -lfl/' buildtools/b43/assembler/Makefile
          test "$(sha256sum firmwares/bcm4375b1/18_41_117_sta/bcmdhd_sta.bin_b1 | cut -d' ' -f1)" = "1676f46ce56b96f58dc70de08beaab4ab3362ee6dd751465a8d6a0023c3c54ad"
          python3 "$GITHUB_WORKSPACE/sdr-probe/patch_pr663.py" patches/bcm4375b1/18_41_117_sta/nexmon/src/ioctl.c
          grep -n -A28 -B2 'case 0x630' patches/bcm4375b1/18_41_117_sta/nexmon/src/ioctl.c

      - name: Build BCM4375 SDR probe firmware
        shell: bash
        run: |
          cd /tmp/nexmon-sdr
          source setup_env.sh
          make -j2
          cd patches/bcm4375b1/18_41_117_sta/nexmon
          make init
          make -j1
          mkdir -p "$GITHUB_WORKSPACE/sdr-probe-out"
          cp bcmdhd_sta.bin_b1 "$GITHUB_WORKSPACE/sdr-probe-out/bcmdhd_sta_rx42_sdr_probe_v1.bin"
          sha256sum bcmdhd_sta.bin_b1 | tee "$GITHUB_WORKSPACE/sdr-probe-out/sha256.txt"
          stat -c '%n %s bytes' bcmdhd_sta.bin_b1 | tee "$GITHUB_WORKSPACE/sdr-probe-out/stat.txt"
          cp log/compiler.log "$GITHUB_WORKSPACE/sdr-probe-out/" 2>/dev/null || true
          cp log/linker.err "$GITHUB_WORKSPACE/sdr-probe-out/" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: BCM4375-RX42-SDR-Probe-v1
          path: sdr-probe-out/

      - name: Bundle verified Nexmon BCM4375B1 18.41.117 firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/nexmon-artifact bcm4375lab/src/main/assets/nexmon
          mkdir -p /tmp/nexmon-artifact bcm4375lab/src/main/assets/nexmon
          gh api repos/${{ github.repository }}/actions/artifacts/9085679307/zip > /tmp/nexmon.zip
          unzip -q /tmp/nexmon.zip -d /tmp/nexmon-artifact
          test "$(sha256sum /tmp/nexmon-artifact/bcmdhd_sta_nexmon_18_41_117.bin | cut -d' ' -f1)" = "ec77f799a989e8104322d3c51901685426389c435a968e30d89f134f47c03d0c"
          cp /tmp/nexmon-artifact/bcmdhd_sta_nexmon_18_41_117.bin bcm4375lab/src/main/assets/nexmon/bcmdhd_sta_nexmon_18_41_117.bin

      - name: Build arm64 Nexmon probes
        shell: bash
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(find "${ANDROID_SDK_ROOT}/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n1)"
          fi
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          test -x "$CC"
          mkdir -p bcm4375lab/src/main/jniLibs/arm64-v8a
          "$CC" -O2 -fPIE -pie -Wall -Wextra bcm4375lab/native/nexprobe.c -o bcm4375lab/src/main/jniLibs/arm64-v8a/libnexprobe.so
          "$CC" -O2 -fPIE -pie -Wall -Wextra bcm4375lab/native/monrx.c -o bcm4375lab/src/main/jniLibs/arm64-v8a/libmonrx.so

      - name: Build RX42 firmware dump APK
        run: gradle :rx42dump:assembleDebug --stacktrace

      - name: Build BCM4375 Lab APK
        run: gradle :bcm4375lab:assembleDebug --stacktrace

      - name: Rename APKs
        run: |
          cp rx42dump/build/outputs/apk/debug/rx42dump-debug.apk RX42-S21-Firmware-Dump.apk
          cp bcm4375lab/build/outputs/apk/debug/bcm4375lab-debug.apk BCM4375-Lab-S21.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RX42-S21-Firmware-Dump-APK
          path: RX42-S21-Firmware-Dump.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BCM4375-Lab-S21-APK
          path: BCM4375-Lab-S21.apk

      - name: Publish latest diagnostics APK release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rx42dump-latest
          name: RX42 / BCM4375 Diagnostics - Latest
          body: BCM4375 Lab inclui Nexmon BCM4375B1 18.41.117, one-shot Magisk e probes nativos.
          files: |
            RX42-S21-Firmware-Dump.apk
            BCM4375-Lab-S21.apk
          make_latest: false
          overwrite_files: true
