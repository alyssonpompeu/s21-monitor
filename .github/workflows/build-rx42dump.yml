name: Build RX42 S21 Firmware Dump APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'rx42dump/**'
      - 'bcm4375lab/**'
      - 'settings.gradle'
      - '.github/workflows/build-rx42dump.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'rx42dump/**'
      - 'bcm4375lab/**'
      - 'settings.gradle'
      - '.github/workflows/build-rx42dump.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build RX42 firmware dump APK
        run: gradle :rx42dump:assembleDebug --stacktrace

      - name: Build BCM4375 Lab APK
        run: gradle :bcm4375lab:assembleDebug --stacktrace

      - name: Rename APKs
        run: |
          cp rx42dump/build/outputs/apk/debug/rx42dump-debug.apk RX42-S21-Firmware-Dump.apk
          cp bcm4375lab/build/outputs/apk/debug/bcm4375lab-debug.apk BCM4375-Lab-S21.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RX42-S21-Firmware-Dump-APK
          path: RX42-S21-Firmware-Dump.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BCM4375-Lab-S21-APK
          path: BCM4375-Lab-S21.apk

      - name: Publish latest diagnostics APK release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rx42dump-latest
          name: RX42 / BCM4375 Diagnostics - Latest
          body: Aplicativos de diagnóstico para o Broadcom BCM4375B1 do Galaxy S21. BCM4375 Lab v1 permanece somente leitura e não troca firmware.
          files: |
            RX42-S21-Firmware-Dump.apk
            BCM4375-Lab-S21.apk
          make_latest: false
          overwrite_files: true
