name: Build S21 MiniPC G991B APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-s21-minipc.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "S21_MINIPC_BUILD_TRIGGER.txt"

permissions:
  contents: write

concurrency:
  group: s21-minipc-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout host repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Clone Mali runtime base
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch bionic-mali-1.0 https://github.com/GunaCharanTeja/WinlatorMali.git S21-MiniPC-src
          cd S21-MiniPC-src
          git submodule update --init --recursive --depth 1 || git submodule update --init --recursive

      - name: Apply G991B test profile
        shell: bash
        run: |
          set -euxo pipefail
          cd S21-MiniPC-src
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          required = {
              'applicationId "com.winlator.mali"': 'applicationId "com.alysson.s21minipc"',
              'resValue "string", "app_name", "Winlator Mali"': 'resValue "string", "app_name", "S21 MiniPC"',
              'versionName "1.0 Bionic"': 'versionName "0.1 G991B"',
          }
          for old, new in required.items():
              if old not in text:
                  raise SystemExit(f'Required patch target not found: {old}')
              text = text.replace(old, new, 1)
          gradle.write_text(text, encoding='utf-8')

          strings = Path('app/src/main/res/values/strings.xml')
          text = strings.read_text(encoding='utf-8')
          text = text.replace('<string name="app_name">Winlator Mali</string>', '<string name="app_name">S21 MiniPC</string>', 1)
          strings.write_text(text, encoding='utf-8')

          container = Path('app/src/main/java/com/winlator/cmod/container/Container.java')
          text = container.read_text(encoding='utf-8')
          patches = {
              'private boolean showFPS;': 'private boolean showFPS = true;',
              'private byte startupSelection = STARTUP_SELECTION_ESSENTIAL;': 'private byte startupSelection = STARTUP_SELECTION_AGGRESSIVE;',
              'private String box64Preset = Box64Preset.COMPATIBILITY;': 'private String box64Preset = Box64Preset.INTERMEDIATE;',
          }
          for old, new in patches.items():
              if old not in text:
                  raise SystemExit(f'Container patch target not found: {old}')
              text = text.replace(old, new, 1)
          container.write_text(text, encoding='utf-8')

          detail = Path('app/src/main/java/com/winlator/cmod/ContainerDetailFragment.java')
          text = detail.read_text(encoding='utf-8')
          detail_patches = {
              'cbShowFPS.setChecked(isEditMode() && container.isShowFPS());': 'cbShowFPS.setChecked(!isEditMode() || container.isShowFPS());',
              'previousStartupSelection != -1 ? previousStartupSelection : Container.STARTUP_SELECTION_ESSENTIAL': 'previousStartupSelection != -1 ? previousStartupSelection : Container.STARTUP_SELECTION_AGGRESSIVE',
              'preferences.getString("box64_preset", Box64Preset.COMPATIBILITY)': 'preferences.getString("box64_preset", Box64Preset.INTERMEDIATE)',
          }
          for old, new in detail_patches.items():
              if old not in text:
                  raise SystemExit(f'Detail patch target not found: {old}')
              text = text.replace(old, new, 1)
          detail.write_text(text, encoding='utf-8')
          PY

          cat > S21_MINIPC_PROFILE.txt <<'EOF'
          S21 MiniPC v0.1 - G991B test profile
          Target: Samsung Galaxy S21 SM-G991B / Exynos 2100 / Mali-G78 MP14
          Runtime base: WinlatorMali bionic-mali-1.0
          ABI: arm64-v8a only
          Default desktop: 1280x720
          Graphics: Mali wrapper + DXVK/VKD3D defaults from runtime base
          CPU translator: FEXCore default; Box64 preset Intermediate when selected
          Startup: Aggressive/minimal test profile
          FPS overlay: enabled by default for new containers
          Package: com.alysson.s21minipc
          Purpose: compatibility/performance test; no ADB or Termux required for normal use
          EOF

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Build signed test APK
        shell: bash
        run: |
          set -euxo pipefail
          cd S21-MiniPC-src
          chmod +x gradlew
          ./gradlew :app:assembleStandardRelease --stacktrace --no-daemon

      - name: Collect APK and checksums
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          APK="$(find S21-MiniPC-src/app/build/outputs/apk/standard/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/S21-MiniPC-G991B-v0.1.apk
          cp S21-MiniPC-src/S21_MINIPC_PROFILE.txt dist/S21_MINIPC_PROFILE.txt
          sha256sum dist/S21-MiniPC-G991B-v0.1.apk | tee dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: S21-MiniPC-G991B-v0.1
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling test release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          TAG="s21-minipc-v0.1-test"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" dist/* \
            --title "S21 MiniPC v0.1 - G991B Test" \
            --notes "Experimental G991B/Exynos 2100/Mali-G78 MP14 Windows-game runtime test. ARM64 only. Based on the open-source WinlatorMali bionic runtime, renamed and preconfigured for 720p testing, FPS overlay, Intermediate Box64 fallback and aggressive/minimal startup. Install directly on the S21; normal use does not require ADB or Termux."
