name: Build G991B Debloat APK

on:
  workflow_dispatch:
  push:
    branches: [ "debloat-g991b-v1" ]
    paths:
      - 'debloat/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/build-debloat-g991b.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable debug APK
        run: gradle :debloat:assembleDebug --stacktrace

      - name: Rename APK
        run: cp debloat/build/outputs/apk/debug/debloat-debug.apk G991B-Debloat-Root-v1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: G991B-Debloat-Root-v1
          path: G991B-Debloat-Root-v1.apk
