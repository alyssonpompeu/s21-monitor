name: Build Flashlight Shortcut APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'flashlight/**'
      - 'settings.gradle'
      - '.github/workflows/build-flashlight-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build flashlight APK and capture log
        id: flashlight_build
        shell: bash
        run: |
          set +e
          gradle :flashlight:assembleDebug --stacktrace 2>&1 | tee flashlight-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Rename APK
        if: steps.flashlight_build.outputs.exit_code == '0'
        run: cp flashlight/build/outputs/apk/debug/flashlight-debug.apk Lanterna-Atalho.apk

      - uses: actions/upload-artifact@v4
        if: steps.flashlight_build.outputs.exit_code == '0'
        with:
          name: Lanterna-Atalho-APK
          path: Lanterna-Atalho.apk

      - name: Publish flashlight APK release
        if: steps.flashlight_build.outputs.exit_code == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flashlight-latest
          name: Lanterna - Atalho APK
          body: APK Android que alterna a lanterna com um toque no ícone. Toque novamente para desligar.
          files: Lanterna-Atalho.apk
          make_latest: false
          overwrite_files: true

      - name: Record flashlight build result
        shell: bash
        run: |
          printf 'run_id=%s\nexit_code=%s\n' "${GITHUB_RUN_ID}" "${{ steps.flashlight_build.outputs.exit_code }}" > flashlight-last-build.txt
          tail -n 160 flashlight-build.log > flashlight-last-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flashlight-last-build.txt flashlight-last-build.log
          git commit -m "Record flashlight APK build result [skip ci]" || exit 0
          git push

      - name: Fail workflow if APK build failed
        if: steps.flashlight_build.outputs.exit_code != '0'
        run: exit 1
