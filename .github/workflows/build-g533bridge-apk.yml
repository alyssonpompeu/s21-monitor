name: Build G533 Bridge Preflight APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "g533bridge/**"
      - "settings.gradle"
      - ".github/workflows/build-g533bridge-apk.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build APK
        run: gradle :g533bridge:assembleDebug --stacktrace
      - name: Rename
        run: cp g533bridge/build/outputs/apk/debug/g533bridge-debug.apk G533-Bridge-Preflight-S21.apk
      - uses: actions/upload-artifact@v4
        with:
          name: G533-Bridge-Preflight-S21-APK
          path: G533-Bridge-Preflight-S21.apk
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: g533-bridge-preflight-latest
          name: G533 Bridge Preflight (S21)
          body: "Read-only Broadcom BCM4375B1 inventory. Does not emulate G533 receiver."
          files: G533-Bridge-Preflight-S21.apk
          make_latest: false
          overwrite_files: true
