name: Build Exynos 2100 Tuner APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "exynos2100-tuner" ]
    paths:
      - 'exynostuner/**'
      - 'settings.gradle'
      - '.github/workflows/build-exynos-tuner-apk.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'exynostuner/**'
      - 'settings.gradle'
      - '.github/workflows/build-exynos-tuner-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        id: build
        shell: bash
        run: |
          set +e
          gradle :exynostuner:assembleDebug --stacktrace 2>&1 | tee exynos-tuner-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Prepare APK
        if: steps.build.outputs.exit_code == '0'
        run: cp exynostuner/build/outputs/apk/debug/exynostuner-debug.apk Exynos-2100-Tuner.apk
      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.exit_code == '0'
        with:
          name: Exynos-2100-Tuner-APK
          path: Exynos-2100-Tuner.apk
      - name: Record build result
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          printf 'run_id=%s\nhead_sha=%s\nexit_code=%s\n--- build log tail ---\n' "${{ github.run_id }}" "${{ github.sha }}" "${{ steps.build.outputs.exit_code }}" > exynos-tuner-last-build.txt
          tail -n 160 exynos-tuner-build.log >> exynos-tuner-last-build.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exynos-tuner-last-build.txt
          git commit -m "Record Exynos tuner APK build [skip ci]" || true
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}" || true
      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
