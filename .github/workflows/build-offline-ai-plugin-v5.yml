name: Build Offline AI Plugin Platform v5

on:
  workflow_dispatch:
  push:
    branches: [ "feature/offline-ptbr-ai-persistent-projects-v5" ]
    paths-ignore:
      - 'offlineai-plugin-v5-last-successful-build.txt'

permissions:
  contents: write

jobs:
  build-plugin-platform-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      LLAMA_CPP_COMMIT: 153d324bcf86d220b235ca010eeb11213f32b5d1
      V4_APK_SHA256: db488ef8679e515281c51eba36f02173a83e430e001622b42222a1058dd57ed3
      V4_RELEASE_BASE: https://github.com/alyssonpompeu/s21-monitor/releases/download/offline-ai-plugin-platform-v4
      QWEN_MODEL_FILE: Qwen3.5-2B-Q4_K_M.gguf
      QWEN_MODEL_SHA256: aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223

    steps:
      - name: Checkout Plugin Platform v5
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip file
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Pin llama.cpp source and tune S21 runtime
        shell: bash
        run: |
          rm -rf vendor/llama.cpp
          git clone https://github.com/ggml-org/llama.cpp.git vendor/llama.cpp
          git -C vendor/llama.cpp checkout "$LLAMA_CPP_COMMIT"
          git -C vendor/llama.cpp submodule update --init --recursive
          python3 - <<'PY'
          from pathlib import Path
          native = Path('vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp')
          text = native.read_text(encoding='utf-8')
          replacements = {
              'constexpr int   N_THREADS_MAX           = 4;': 'constexpr int   N_THREADS_MAX           = 3;',
              'constexpr int   DEFAULT_CONTEXT_SIZE    = 8192;': 'constexpr int   DEFAULT_CONTEXT_SIZE    = 4096;',
              'constexpr int   BATCH_SIZE              = 512;': 'constexpr int   BATCH_SIZE              = 128;',
              'constexpr float DEFAULT_SAMPLER_TEMP    = 0.3f;': 'constexpr float DEFAULT_SAMPLER_TEMP    = 0.75f;',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Pinned ai_chat.cpp no longer matches expected point: {old}')
              text = text.replace(old, new, 1)
          native.write_text(text, encoding='utf-8')

          activity = Path('offlineai/src/main/java/com/alysson/offlineai/MainActivity.kt')
          app = activity.read_text(encoding='utf-8')
          markers = {
              'Qwen3.5-0.8B-Q4_K_M.gguf': 'Qwen3.5-2B-Q4_K_M.gguf',
              'bd258782e35f7f458f8aced1adc053e6e92e89bc735ba3be89d38a06121dc517': 'aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223',
          }
          for old, new in markers.items():
              if old not in app:
                  raise SystemExit(f'MainActivity model marker missing: {old}')
              app = app.replace(old, new, 1)
          activity.write_text(app, encoding='utf-8')
          PY

      - name: Apply Workspace v2 v3 v4 and v5 patches
        shell: bash
        run: |
          python3 scripts/apply_workspace_v2_ui.py
          python3 scripts/apply_workspace_v3.py
          GITHUB_ACTIONS=false python3 scripts/apply_workspace_v4.py
          python3 scripts/apply_workspace_v5.py

      - name: Reuse verified v4 neural assets and native image engines
        shell: bash
        run: |
          mkdir -p build/v4-reuse offlineai/src/main/assets offlineai/src/main/jniLibs/arm64-v8a
          curl -L --fail --retry 5 --retry-delay 5 \
            "$V4_RELEASE_BASE/IA-Offline-Plugin-v4-S21.apk" -o build/v4-reuse/v4.apk
          echo "$V4_APK_SHA256  build/v4-reuse/v4.apk" | sha256sum -c -

          unzip -p build/v4-reuse/v4.apk assets/model.gguf > offlineai/src/main/assets/model.gguf
          echo "$QWEN_MODEL_SHA256  offlineai/src/main/assets/model.gguf" | sha256sum -c -
          unzip -p build/v4-reuse/v4.apk assets/ptbr_memory.db > offlineai/src/main/assets/ptbr_memory.db
          unzip -p build/v4-reuse/v4.apk assets/plugin_pubkey.der > offlineai/src/main/assets/plugin_pubkey.der
          unzip -p build/v4-reuse/v4.apk lib/arm64-v8a/libsd-cli.so > offlineai/src/main/jniLibs/arm64-v8a/libsd-cli.so
          unzip -p build/v4-reuse/v4.apk lib/arm64-v8a/libsd-vulkan.so > offlineai/src/main/jniLibs/arm64-v8a/libsd-vulkan.so
          chmod 755 offlineai/src/main/jniLibs/arm64-v8a/libsd-cli.so offlineai/src/main/jniLibs/arm64-v8a/libsd-vulkan.so
          test -s offlineai/src/main/assets/model.gguf
          test -s offlineai/src/main/assets/ptbr_memory.db
          test -s offlineai/src/main/assets/plugin_pubkey.der
          test -s offlineai/src/main/jniLibs/arm64-v8a/libsd-cli.so
          test -s offlineai/src/main/jniLibs/arm64-v8a/libsd-vulkan.so

      - name: Reuse v4 signed Builder and Coder packs
        shell: bash
        run: |
          curl -L --fail --retry 5 --retry-delay 5 \
            "$V4_RELEASE_BASE/Developer-Builder-Core-v1.iapack" -o Developer-Builder-Core-v1.iapack
          curl -L --fail --retry 5 --retry-delay 5 \
            "$V4_RELEASE_BASE/Developer-Builder-Core-v1.iapack.sha256" -o Developer-Builder-Core-v1.iapack.sha256
          curl -L --fail --retry 5 --retry-delay 5 \
            "$V4_RELEASE_BASE/Coder-Qwen2.5-1.5B-Q4KM.iapack" -o Coder-Qwen2.5-1.5B-Q4KM.iapack
          curl -L --fail --retry 5 --retry-delay 5 \
            "$V4_RELEASE_BASE/Coder-Qwen2.5-1.5B-Q4KM.iapack.sha256" -o Coder-Qwen2.5-1.5B-Q4KM.iapack.sha256
          sha256sum -c Developer-Builder-Core-v1.iapack.sha256
          sha256sum -c Coder-Qwen2.5-1.5B-Q4KM.iapack.sha256

      - name: Record Plugin v5 source manifest
        shell: bash
        run: |
          cat > offlineai/src/main/assets/source_manifest.json <<EOF
          {
            "variant": "plugin-platform-v5",
            "language": "pt-BR",
            "runtime": "llama.cpp",
            "llama_cpp_commit": "$LLAMA_CPP_COMMIT",
            "runtime_policy": "ARM64; max 3 llama workers; context 4096; batch 128; high-quality profile fixed; CPU/GPU/RAM safety targets; 2 GiB resident checkpoint target; thermal guard",
            "main_model": "$QWEN_MODEL_FILE",
            "main_model_sha256": "$QWEN_MODEL_SHA256",
            "plugin_format": "iapack-v1-ed25519-sha256",
            "image_runtime": "stable-diffusion.cpp CPU plus experimental Vulkan engine reused byte-for-byte from verified v4 APK",
            "persistence": "SQLite durable turns + append-only Unilaw journal + Storage Access Framework mirror + grow-on-demand spill checkpoints capped at 5 GiB; not kernel swap",
            "features": ["automatic project per new chat", "folder project UI", "project research sources", "arbitrary safe source types", "plugin selector", "high quality fixed", "live token streaming", "think tag suppression", "live code preview", "inline CPU GPU RAM controls", "durable chat recovery", "shared Documents mirror"]
          }
          EOF

      - name: Build installable Plugin Platform v5 APK
        id: build_apk
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle :offlineai:assembleDebug --stacktrace --no-daemon 2>&1 | tee offlineai-plugin-v5-build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path('offlineai-plugin-v5-build.log').read_text(encoding='utf-8', errors='replace').splitlines()
          patterns = re.compile(r'(error:|fatal error:|CMake Error|FAILED:|ninja:|Execution failed|BUILD FAILED|What went wrong|Caused by:)')
          hits = [i for i, line in enumerate(src) if patterns.search(line)]
          selected = set()
          for i in hits:
              selected.update(range(max(0, i - 14), min(len(src), i + 38)))
          lines = [src[i] for i in sorted(selected)] or src[-700:]
          Path('offlineai-plugin-v5-last-build-error.txt').write_text('\n'.join(lines[-1200:]) + '\n', encoding='utf-8')
          PY
            cat offlineai-plugin-v5-last-build-error.txt
            exit "$STATUS"
          fi
          cp offlineai/build/outputs/apk/debug/offlineai-debug.apk IA-Offline-Plugin-v5-S21.apk
          sha256sum IA-Offline-Plugin-v5-S21.apk | tee IA-Offline-Plugin-v5-S21.apk.sha256
          unzip -l IA-Offline-Plugin-v5-S21.apk | grep -E 'assets/plugin_pubkey.der|assets/model.gguf|assets/ptbr_memory.db|lib/arm64-v8a/libsd-cli.so|lib/arm64-v8a/libsd-vulkan.so'
          ls -lh IA-Offline-Plugin-v5-S21.apk

      - name: Upload v5 build diagnostics
        if: failure() && steps.build_apk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: offline-ai-plugin-v5-build-diagnostics
          path: |
            offlineai-plugin-v5-last-build-error.txt
            offlineai-plugin-v5-build.log
          retention-days: 7

      - name: Upload Plugin v5 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IA-Offline-Plugin-v5-S21-APK
          path: |
            IA-Offline-Plugin-v5-S21.apk
            IA-Offline-Plugin-v5-S21.apk.sha256
          compression-level: 0

      - name: Publish Plugin Platform v5 and compatible packs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: offline-ai-plugin-platform-v5
          name: IA Offline Plugin Platform v5 para Galaxy S21
          body: |
            Edição experimental separada da v4 para rollback imediato.

            - Novo chat cria automaticamente um novo projeto persistente.
            - Projetos aparecem como pastas; ⋮ abre Fontes de pesquisa, Renomear e Excluir.
            - Fontes aceitam PDF, imagens, ZIP/APK, EXE e outros tipos. Binários nunca são executados: apenas metadados/strings e conteúdo textual seguro são indexados.
            - O seletor principal escolhe o plugin: Texto/Qwen, Tiny-SD, Coder ou Builder. O seletor de qualidade foi removido; Alta qualidade é fixa.
            - A pergunta permanece na barra central durante a resposta.
            - Saída aparece token a token; tags <think> são filtradas; código recebe prévia ao vivo.
            - CPU/GPU/RAM também aparecem diretamente abaixo da lista de plugins; backends continuam configuráveis por plugin.
            - Conversas são persistidas incrementalmente em SQLite + chat.unilaw.persist. Com uma pasta concedida pelo usuário, chat.md/manifest/checkpoints também são espelhados em Documentos/Unilaw.
            - O alvo residente de 2 GiB aciona checkpoint antecipado. O spill de até 5 GiB cresce sob demanda e não é swap do kernel Android.
            - Mantém CPU seguro e Vulkan experimental do Tiny-SD da v4.

            Instalação: APK v5 -> Developer Builder Core -> Coder Pack opcional -> Tiny-SD em Plugins locais.
          files: |
            IA-Offline-Plugin-v5-S21.apk
            IA-Offline-Plugin-v5-S21.apk.sha256
            Developer-Builder-Core-v1.iapack
            Developer-Builder-Core-v1.iapack.sha256
            Coder-Qwen2.5-1.5B-Q4KM.iapack
            Coder-Qwen2.5-1.5B-Q4KM.iapack.sha256
          make_latest: false
          overwrite_files: true

      - name: Record successful Plugin v5 workflow run
        shell: bash
        run: |
          printf 'run_id=%s\ncommit=%s\ncompleted_utc=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > offlineai-plugin-v5-last-successful-build.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offlineai-plugin-v5-last-successful-build.txt
          git commit -m 'Record Plugin Platform v5 APK build [skip ci]' || exit 0
          git push origin HEAD:feature/offline-ptbr-ai-persistent-projects-v5
