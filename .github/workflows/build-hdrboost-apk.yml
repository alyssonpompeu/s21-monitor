name: Build HDR Boost APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'hdrboost/**'
      - 'settings.gradle'
      - '.github/workflows/build-hdrboost-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build HDR Boost APK
        id: build
        shell: bash
        run: |
          set +e
          gradle :hdrboost:assembleDebug --stacktrace 2>&1 | tee hdrboost-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare APK
        if: steps.build.outputs.exit_code == '0'
        run: cp hdrboost/build/outputs/apk/debug/hdrboost-debug.apk HDR-Boost-S21.apk

      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.exit_code == '0'
        with:
          name: HDR-Boost-S21-APK
          path: HDR-Boost-S21.apk

      - name: Publish release
        if: steps.build.outputs.exit_code == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hdrboost-latest
          name: HDR Boost S21 APK
          body: One-tap Samsung display boost: max manual brightness, Vivid mode and reversible display settings. Does not force hardware HDR/HBM.
          files: HDR-Boost-S21.apk
          make_latest: false
          overwrite_files: true

      - name: Record build result
        if: always()
        shell: bash
        run: |
          printf 'run_id=%s\nhead_sha=%s\nexit_code=%s\n--- build log tail ---\n' "${{ github.run_id }}" "${{ github.sha }}" "${{ steps.build.outputs.exit_code }}" > hdrboost-last-build.txt
          tail -n 160 hdrboost-build.log >> hdrboost-last-build.txt 2>/dev/null || true
          git pull --rebase origin main || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hdrboost-last-build.txt
          git commit -m "Record HDR Boost APK build [skip ci]" || true
          git push || true

      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
