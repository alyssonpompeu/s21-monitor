name: Build GPU Clock APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'gpuclock/**'
      - 'settings.gradle'
      - '.github/workflows/build-gpuclock-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build GPU Clock APK
        id: build
        shell: bash
        run: |
          set +e
          gradle :gpuclock:assembleDebug --stacktrace 2>&1 | tee gpuclock-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare APK
        if: steps.build.outputs.exit_code == '0'
        run: cp gpuclock/build/outputs/apk/debug/gpuclock-debug.apk GPU-Clock-Control.apk

      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.exit_code == '0'
        with:
          name: GPU-Clock-Control-APK
          path: GPU-Clock-Control.apk

      - name: Publish release
        if: steps.build.outputs.exit_code == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gpuclock-latest
          name: GPU Root & Clock Test APK
          body: Version 1.1 with root/bootloader diagnostics and temporary acceptance testing of kernel-exposed GPU frequencies. No voltage changes and no thermal protection bypass.
          files: GPU-Clock-Control.apk
          make_latest: false
          overwrite_files: true

      - name: Record build result
        if: always()
        shell: bash
        run: |
          printf 'run_id=%s\nhead_sha=%s\nexit_code=%s\n--- build log tail ---\n' "${{ github.run_id }}" "${{ github.sha }}" "${{ steps.build.outputs.exit_code }}" > gpuclock-last-build.txt
          tail -n 160 gpuclock-build.log >> gpuclock-last-build.txt 2>/dev/null || true
          git pull --rebase origin main || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gpuclock-last-build.txt
          git commit -m "Record GPU Clock APK build [skip ci]" || true
          git push || true

      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
