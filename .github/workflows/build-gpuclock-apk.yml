name: Build Android Utility APKs

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'gpuclock/**'
      - 'hdrboost/**'
      - 'wifiradar/**'
      - 'wifispectrum/**'
      - 'settings.gradle'
      - '.github/workflows/build-gpuclock-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build GPU Clock APK
        id: build
        shell: bash
        run: |
          set +e
          gradle :gpuclock:assembleDebug --stacktrace 2>&1 | tee gpuclock-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Prepare APK
        if: steps.build.outputs.exit_code == '0'
        run: cp gpuclock/build/outputs/apk/debug/gpuclock-debug.apk GPU-Clock-Control.apk
      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.exit_code == '0'
        with:
          name: GPU-Clock-Control-APK
          path: GPU-Clock-Control.apk
      - name: Record build result
        if: always()
        shell: bash
        run: |
          printf 'run_id=%s\nhead_sha=%s\nexit_code=%s\n--- build log tail ---\n' "${{ github.run_id }}" "${{ github.sha }}" "${{ steps.build.outputs.exit_code }}" > gpuclock-last-build.txt
          tail -n 160 gpuclock-build.log >> gpuclock-last-build.txt 2>/dev/null || true
          git pull --rebase origin main || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gpuclock-last-build.txt
          git commit -m "Record GPU Clock APK build [skip ci]" || true
          git push || true
      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1

  hdrboost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build HDR Boost APK
        id: hdrbuild
        shell: bash
        run: |
          set +e
          gradle :hdrboost:assembleDebug --stacktrace 2>&1 | tee hdrboost-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Prepare HDR Boost APK
        if: steps.hdrbuild.outputs.exit_code == '0'
        run: cp hdrboost/build/outputs/apk/debug/hdrboost-debug.apk HDR-Boost-S21.apk
      - uses: actions/upload-artifact@v4
        if: steps.hdrbuild.outputs.exit_code == '0'
        with:
          name: HDR-Boost-S21-APK
          path: HDR-Boost-S21.apk
      - name: Record HDR Boost build result
        if: always()
        shell: bash
        run: |
          printf 'run_id=%s\nhead_sha=%s\nexit_code=%s\n--- build log tail ---\n' "${{ github.run_id }}" "${{ github.sha }}" "${{ steps.hdrbuild.outputs.exit_code }}" > hdrboost-last-build.txt
          tail -n 160 hdrboost-build.log >> hdrboost-last-build.txt 2>/dev/null || true
          git pull --rebase origin main || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hdrboost-last-build.txt
          git commit -m "Record HDR Boost APK build [skip ci]" || true
          git push || true
      - name: Fail if HDR Boost build failed
        if: steps.hdrbuild.outputs.exit_code != '0'
        run: exit 1

  wifiradar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Wi-Fi Radar APK
        id: radarbuild
        shell: bash
        run: |
          set +e
          gradle :wifiradar:assembleDebug --stacktrace 2>&1 | tee wifiradar-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Prepare Wi-Fi Radar APK
        if: steps.radarbuild.outputs.exit_code == '0'
        run: cp wifiradar/build/outputs/apk/debug/wifiradar-debug.apk WiFi-Hunter-Radar.apk
      - uses: actions/upload-artifact@v4
        if: steps.radarbuild.outputs.exit_code == '0'
        with:
          name: WiFi-Hunter-Radar-APK
          path: WiFi-Hunter-Radar.apk
      - name: Record Wi-Fi Radar build result
        if: always()
        shell: bash
        run: |
          printf 'run_id=%s\nhead_sha=%s\nexit_code=%s\n--- build log tail ---\n' "${{ github.run_id }}" "${{ github.sha }}" "${{ steps.radarbuild.outputs.exit_code }}" > wifiradar-last-build.txt
          tail -n 180 wifiradar-build.log >> wifiradar-last-build.txt 2>/dev/null || true
          git pull --rebase origin main || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wifiradar-last-build.txt
          git commit -m "Record Wi-Fi Radar APK build [skip ci]" || true
          git push || true
      - name: Fail if Wi-Fi Radar build failed
        if: steps.radarbuild.outputs.exit_code != '0'
        run: exit 1

  wifispectrum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Wi-Fi Spectrogram APK
        id: spectrumbuild
        shell: bash
        run: |
          set +e
          gradle :wifispectrum:assembleDebug --stacktrace 2>&1 | tee wifispectrum-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Prepare Wi-Fi Spectrogram APK
        if: steps.spectrumbuild.outputs.exit_code == '0'
        run: cp wifispectrum/build/outputs/apk/debug/wifispectrum-debug.apk WiFi-Spectrogram.apk
      - uses: actions/upload-artifact@v4
        if: steps.spectrumbuild.outputs.exit_code == '0'
        with:
          name: WiFi-Spectrogram-APK
          path: WiFi-Spectrogram.apk
      - name: Fail if Wi-Fi Spectrogram build failed
        if: steps.spectrumbuild.outputs.exit_code != '0'
        run: |
          tail -n 200 wifispectrum-build.log || true
          exit 1
