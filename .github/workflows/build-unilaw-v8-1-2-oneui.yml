name: Build Unilaw v8.1.2 OneUI Hard Fix

on:
  push:
    branches: [ "feature/unilaw-plugin-bundle-v8-1" ]
    paths:
      - 'scripts/apply_workspace_v811_oneui_startup_fix.py'
      - '.github/workflows/build-unilaw-v8-1-2-oneui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v812:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LLAMA_CPP_COMMIT: 153d324bcf86d220b235ca010eeb11213f32b5d1
      V71_RELEASE_BASE: https://github.com/alyssonpompeu/s21-monitor/releases/download/offline-ai-corepacks-v7-1-recovery
      V71_CORE_SHA256: 588e4cde917891b20c542cb665148ba511741ceec5c3b14926f8fcfc4782c66e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android build environment
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip file zip
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Pin llama.cpp and tune Exynos 2100 runtime
        shell: bash
        run: |
          rm -rf vendor/llama.cpp
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git vendor/llama.cpp
          git -C vendor/llama.cpp checkout "$LLAMA_CPP_COMMIT"
          git -C vendor/llama.cpp submodule update --init --recursive
          python3 - <<'PY'
          from pathlib import Path
          p=Path('vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp')
          s=p.read_text(encoding='utf-8')
          for a,b in {
              'constexpr int   N_THREADS_MAX           = 4;':'constexpr int   N_THREADS_MAX           = 3;',
              'constexpr int   DEFAULT_CONTEXT_SIZE    = 8192;':'constexpr int   DEFAULT_CONTEXT_SIZE    = 4096;',
              'constexpr int   BATCH_SIZE              = 512;':'constexpr int   BATCH_SIZE              = 128;',
              'constexpr float DEFAULT_SAMPLER_TEMP    = 0.3f;':'constexpr float DEFAULT_SAMPLER_TEMP    = 0.75f;',
          }.items():
              if a not in s: raise SystemExit('native marker missing: '+a)
              s=s.replace(a,b,1)
          p.write_text(s,encoding='utf-8')
          a=Path('offlineai/src/main/java/com/alysson/offlineai/MainActivity.kt')
          s=a.read_text(encoding='utf-8')
          for x,y in {
              'Qwen3.5-0.8B-Q4_K_M.gguf':'Qwen3.5-2B-Q4_K_M.gguf',
              'bd258782e35f7f458f8aced1adc053e6e92e89bc735ba3be89d38a06121dc517':'aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223',
          }.items():
              if x not in s: raise SystemExit('model marker missing: '+x)
              s=s.replace(x,y,1)
          a.write_text(s,encoding='utf-8')
          PY

      - name: Apply Workspace lineage through v8.1.2
        shell: bash
        run: |
          python3 -m py_compile scripts/apply_workspace_v811_oneui_startup_fix.py
          python3 scripts/apply_workspace_v2_ui.py
          python3 scripts/apply_workspace_v3.py
          GITHUB_ACTIONS=false python3 scripts/apply_workspace_v4.py
          python3 scripts/apply_workspace_v5.py
          python3 scripts/apply_builder_install_fix_v51.py
          python3 scripts/apply_workspace_v52.py
          python3 scripts/apply_workspace_v521.py
          python3 scripts/apply_workspace_v53.py
          python3 scripts/apply_workspace_v531.py
          python3 scripts/apply_workspace_v6_exynos.py
          python3 scripts/apply_workspace_v7_corepacks.py
          python3 scripts/apply_workspace_v71_bootfix.py
          python3 scripts/apply_workspace_v72_s21_firmware.py
          python3 scripts/apply_workspace_v8_full_suite.py
          python3 scripts/apply_workspace_v8_docs_vision.py
          python3 scripts/apply_workspace_v8_work_ui.py
          python3 scripts/apply_workspace_v81_plugin_bundle.py
          python3 scripts/apply_workspace_v811_oneui_startup_fix.py

      - name: Reuse verified native/runtime assets
        shell: bash
        run: |
          mkdir -p build/v71 offlineai/src/main/assets offlineai/src/main/jniLibs/arm64-v8a
          curl -L --fail --retry 8 --retry-delay 5 "$V71_RELEASE_BASE/Unilaw-AI-Core-S21-v7-1-Recovery.apk" -o build/v71/v71.apk
          echo "$V71_CORE_SHA256  build/v71/v71.apk" | sha256sum -c -
          unzip -p build/v71/v71.apk assets/ptbr_memory.db > offlineai/src/main/assets/ptbr_memory.db
          unzip -p build/v71/v71.apk assets/plugin_pubkey.der > offlineai/src/main/assets/plugin_pubkey.der
          unzip -p build/v71/v71.apk assets/plugin_pubkey_v7.der > offlineai/src/main/assets/plugin_pubkey_v7.der
          unzip -p build/v71/v71.apk lib/arm64-v8a/libsd-cli.so > offlineai/src/main/jniLibs/arm64-v8a/libsd-cli.so
          unzip -p build/v71/v71.apk lib/arm64-v8a/libsd-vulkan.so > offlineai/src/main/jniLibs/arm64-v8a/libsd-vulkan.so
          chmod 755 offlineai/src/main/jniLibs/arm64-v8a/*.so
          rm -f offlineai/src/main/assets/model.gguf

      - name: Verify hardened One UI fix in generated source
        shell: bash
        run: |
          grep -q "applicationId 'com.alysson.unilaw.s21.oneuifix'" offlineai/build.gradle
          grep -q "versionName '8.1.2-oneui-hardfix'" offlineai/build.gradle
          ! grep -q 'setDecorFitsSystemWindows(false)' offlineai/src/main/java/com/alysson/offlineai/UiThemeController.kt
          ! grep -q 'window.insetsController' offlineai/src/main/java/com/alysson/offlineai/UiThemeController.kt
          ! grep -q 'WindowInsetsController' offlineai/src/main/java/com/alysson/offlineai/UiThemeController.kt
          grep -q 'fun applyWindow(activity: Activity)' offlineai/src/main/java/com/alysson/offlineai/UiThemeController.kt
          grep -q 'view.post' offlineai/src/main/java/com/alysson/offlineai/UiThemeController.kt
          grep -q 'root.systemUiVisibility' offlineai/src/main/java/com/alysson/offlineai/UiThemeController.kt

      - name: Build Unilaw v8.1.2
        id: build
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle :offlineai:assembleDebug --stacktrace --no-daemon 2>&1 | tee unilaw-v812-build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            tail -n 1800 unilaw-v812-build.log > unilaw-v812-error.txt
            cat unilaw-v812-error.txt
            exit "$STATUS"
          fi
          cp offlineai/build/outputs/apk/debug/offlineai-debug.apk Unilaw-AI-S21-v8-1-2-OneUI-HardFix.apk
          sha256sum Unilaw-AI-S21-v8-1-2-OneUI-HardFix.apk | tee Unilaw-AI-S21-v8-1-2-OneUI-HardFix.apk.sha256

      - name: Verify APK identity and offline boundary
        shell: bash
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging Unilaw-AI-S21-v8-1-2-OneUI-HardFix.apk | tee main-badging.txt
          grep -q "package: name='com.alysson.unilaw.s21.oneuifix'" main-badging.txt
          grep -q "versionName='8.1.2-oneui-hardfix'" main-badging.txt
          grep -q "native-code: 'arm64-v8a'" main-badging.txt
          if "$AAPT" dump permissions Unilaw-AI-S21-v8-1-2-OneUI-HardFix.apk | grep -q 'android.permission.INTERNET'; then
            echo 'ERROR: main Workspace gained INTERNET permission' >&2; exit 1
          fi
          if unzip -l Unilaw-AI-S21-v8-1-2-OneUI-HardFix.apk | grep -q 'assets/model.gguf'; then
            echo 'ERROR: heavy Qwen payload returned to APK' >&2; exit 1
          fi

      - name: Upload diagnostics
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unilaw-v812-diagnostics
          path: |
            unilaw-v812-build.log
            unilaw-v812-error.txt
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: Unilaw-v8-1-2-OneUI-HardFix
          path: |
            Unilaw-AI-S21-v8-1-2-OneUI-HardFix.apk
            Unilaw-AI-S21-v8-1-2-OneUI-HardFix.apk.sha256
          compression-level: 0

      - name: Publish v8.1.2 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: offline-ai-workspace-v8-1-2-oneui
          name: Unilaw AI v8.1.2 • One UI Hard Startup Fix
          body: |
            Correção endurecida para o crash de inicialização observado no Galaxy S21 SM-G991B/One UI.
            Durante Activity.onCreate() a Unilaw não toca mais em WindowInsetsController, edge-to-edge, cores/contraste das barras nem qualquer operação dependente do DecorView.
            O acabamento das barras do sistema só é aplicado depois de setContentView() e de um post da view raiz, usando flags legadas compatíveis.

            Package de teste isolado: com.alysson.unilaw.s21.oneuifix.
            O APK principal continua sem INTERNET e sem Qwen embutido.
          files: |
            Unilaw-AI-S21-v8-1-2-OneUI-HardFix.apk
            Unilaw-AI-S21-v8-1-2-OneUI-HardFix.apk.sha256
          make_latest: false
          overwrite_files: true
