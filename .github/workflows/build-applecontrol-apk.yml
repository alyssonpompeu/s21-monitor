name: Build G991B Apple Control v1.2 Telemetry APK

on:
  workflow_dispatch:
  push:
    branches: [ "apple-control-v12-telemetry" ]
    paths:
      - 'applecontrol/**'
      - 'settings.gradle'
      - '.github/workflows/build-applecontrol-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Apple Control debug APK
        run: gradle :applecontrol:assembleDebug --stacktrace

      - name: Rename APK
        run: cp applecontrol/build/outputs/apk/debug/applecontrol-debug.apk 'G991B Apple Control v1.2 Telemetry.apk'

      - uses: actions/upload-artifact@v4
        with:
          name: G991B-Apple-Control-v1.2-Telemetry-APK
          path: 'G991B Apple Control v1.2 Telemetry.apk'
          if-no-files-found: error
