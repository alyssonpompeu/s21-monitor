name: Build Wi-Fi Spectrogram Play AAB

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'wifispectrum/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-wifispectrum-play-aab.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Lint release
        run: gradle :wifispectrum:lintRelease --stacktrace

      - name: Build unsigned release App Bundle
        run: gradle :wifispectrum:bundleRelease --stacktrace

      - name: Prepare bundle
        run: cp wifispectrum/build/outputs/bundle/release/wifispectrum-release.aab WiFi-Spectrogram-Pro-Play-unsigned.aab

      - uses: actions/upload-artifact@v4
        with:
          name: WiFi-Spectrogram-Pro-Play-AAB
          path: WiFi-Spectrogram-Pro-Play-unsigned.aab
          if-no-files-found: error
