name: Build Apple Lab v1.1 APK

on:
  workflow_dispatch:
  push:
    branches: [ "apple-control-v13-gpumif" ]
    paths:
      - 'applelab/**'
      - 'settings.gradle'
      - '.github/workflows/build-applelab-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Apple Lab
        run: gradle :applelab:assembleDebug --stacktrace
      - name: Rename APK
        run: cp applelab/build/outputs/apk/debug/applelab-debug.apk 'Apple Lab v1.1.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: Apple-Lab-v1.1-APK
          path: 'Apple Lab v1.1.apk'
          if-no-files-found: error
