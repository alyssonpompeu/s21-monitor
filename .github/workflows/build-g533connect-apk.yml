name: Build G533 Connect APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "g533connect/**"
      - "settings.gradle"
      - ".github/workflows/build-g533connect-apk.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test and build APK
        run: gradle :g533connect:testDebugUnitTest :g533connect:assembleDebug --stacktrace
      - name: Package APK
        run: cp g533connect/build/outputs/apk/debug/g533connect-debug.apk G533-Connect-S21.apk
      - uses: actions/upload-artifact@v4
        with:
          name: G533-Connect-S21-APK
          path: G533-Connect-S21.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: g533-connect-latest
          name: G533 Connect Experimental
          body: "Read-only Android G533 research dashboard and firmware inspector, with truthful pairing capability gates. Not a wireless replacement for dongle A-00073."
          files: G533-Connect-S21.apk
          make_latest: false
          overwrite_files: true
