name: Build MARX LINK V1.0

on:
  workflow_dispatch:
  push:
    branches: [ "marx-link-v1" ]
    paths:
      - '.github/workflows/build-marx-link-v1.yml'
      - 'bcm4375lab/**'
      - 'sdr-probe/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Checkout MARX LINK branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android NDK and build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Install Nexmon build dependencies
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y git gawk qpdf flex libfl-dev bison xxd make patch python3 zlib1g-dev \
            libc6:i386 libstdc++6:i386 zlib1g:i386 libncurses5:i386

      - name: Clone exact Nexmon PR663 BCM4375B1 18.41.117
        shell: bash
        run: |
          git clone --depth 1 https://github.com/seemoo-lab/nexmon.git nexmon
          cd nexmon
          git fetch --depth 1 origin pull/663/head:pr663
          git checkout pr663
          test "$(git rev-parse HEAD)" = "fd117f434e1c479f6819a0ba31f9ca82d75f8a3a"
          sed -i 's/LDFLAGS[[:space:]]*+=[[:space:]]*-ll/LDFLAGS\t\t+= -lfl/' buildtools/b43/assembler/Makefile

      - name: Verify Samsung stock firmware identity
        shell: bash
        run: |
          FW=nexmon/firmwares/bcm4375b1/18_41_117_sta/bcmdhd_sta.bin_b1
          ACTUAL=$(sha256sum "$FW" | awk '{print $1}')
          test "$ACTUAL" = "1676f46ce56b96f58dc70de08beaab4ab3362ee6dd751465a8d6a0023c3c54ad"
          echo "STOCK_SHA256=$ACTUAL"

      - name: Apply MARX LINK AC-core SDR patch
        shell: bash
        run: |
          IOCTL=nexmon/patches/bcm4375b1/18_41_117_sta/nexmon/src/ioctl.c
          python3 sdr-probe/patch_pr663_link.py "$IOCTL"
          # Full AFHDS2A bind candidates need a complete ~1.3 ms waveform.
          sed -i 's/q->count > 4096/q->count > 60000/' "$IOCTL"
          grep -n -A25 'case 0x643' "$IOCTL"
          grep -n -A25 'case 0x646' "$IOCTL"
          grep -q 'LEGACY_0130_PORTAL_NOT_USED_FOR_LINK=1' "$IOCTL"
          grep -q 'XmtTemplateDataLo' "$IOCTL"
          grep -q 'KNOWN_LIMITATION=WLC_PHY_RUNSAMPLES_NOT_MAPPED_FOR_BCM4375B1' "$IOCTL"

      - name: Build patched Nexmon firmware
        shell: bash
        run: |
          cd nexmon
          source setup_env.sh
          make -j2
          cd patches/bcm4375b1/18_41_117_sta/nexmon
          make init
          make -j1
          test -s bcmdhd_sta.bin_b1
          mkdir -p "$GITHUB_WORKSPACE/bcm4375lab/src/main/assets/nexmon"
          cp bcmdhd_sta.bin_b1 "$GITHUB_WORKSPACE/bcm4375lab/src/main/assets/nexmon/bcmdhd_sta_marx_link_v1.bin"
          sha256sum bcmdhd_sta.bin_b1 > "$GITHUB_WORKSPACE/marx-link-firmware-sha256.txt"
          cat "$GITHUB_WORKSPACE/marx-link-firmware-sha256.txt"

      - name: Pin firmware SHA into Android loader
        shell: bash
        run: |
          SHA=$(awk '{print $1}' marx-link-firmware-sha256.txt)
          test -n "$SHA"
          sed -i "s/MARX_LINK_V1_SHA/$SHA/g" bcm4375lab/src/main/java/com/alysson/bcm4375lab/MarxLinkActivity.java
          grep -n 'EXPECTED_SHA' bcm4375lab/src/main/java/com/alysson/bcm4375lab/MarxLinkActivity.java

      - name: Build ARM64 root tools
        shell: bash
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          test -x "$CC"
          OUT=bcm4375lab/src/main/jniLibs/arm64-v8a
          mkdir -p "$OUT"
          "$CC" -O2 -fPIE -pie bcm4375lab/native/nexprobe.c -o "$OUT/libnexprobe.so"
          "$CC" -O2 -fPIE -pie bcm4375lab/native/sdrrx42probe.c -o "$OUT/libsdrrx42probe.so"
          "$CC" -O2 -fPIE -pie bcm4375lab/native/monrx.c -o "$OUT/libmonrx.so"
          "$CC" -O2 -D_GNU_SOURCE -fPIE -pie bcm4375lab/native/marxlinkprobe.c -lm -o "$OUT/libmarxlinkprobe.so"
          file "$OUT"/*.so
          test -x "$OUT/libmarxlinkprobe.so"

      - name: Build MARX LINK APK with Gradle
        shell: bash
        run: |
          gradle :bcm4375lab:clean :bcm4375lab:assembleDebug --stacktrace
          test -s bcm4375lab/build/outputs/apk/debug/bcm4375lab-debug.apk

      - name: Verify APK signature and identity
        shell: bash
        run: |
          APK=bcm4375lab/build/outputs/apk/debug/bcm4375lab-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING=$("$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK")
          echo "$BADGING"
          [[ "$BADGING" == *"package: name='com.alysson.marx.link.v1'"* ]]
          [[ "$BADGING" == *"versionName='1.0.0-link'"* ]]
          [[ "$BADGING" == *"application-label:'MARX LINK V1.0'"* ]]
          mkdir -p out
          cp "$APK" out/MARX-LINK-V1.0.apk
          sha256sum out/MARX-LINK-V1.0.apk > out/APK-SHA256.txt
          cp marx-link-firmware-sha256.txt out/FIRMWARE-SHA256.txt
          cat out/APK-SHA256.txt

      - name: Upload MARX LINK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MARX-LINK-V1.0
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Publish MARX LINK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: marx-link-v1-github-latest
          name: MARX LINK V1.0
          body: |
            Experimental Galaxy S21 / BCM4375B1 AFHDS2A communication lab.

            Uses Nexmon PR663 plus the modern d11ac sample-play register block
            modeled after the official Nexmon SDR implementation. It no longer
            uses the legacy 0x130/0x134 template portal for LINK tests.

            Includes read-only D11AC mapping, bounded low-amplitude RF pulse
            experiments and an AFHDS2A BIND1 waveform candidate generator.
            Full bind is not claimed until an arbitrary-GFSK RX path can learn
            the receiver ID.
          files: |
            out/MARX-LINK-V1.0.apk
            out/APK-SHA256.txt
            out/FIRMWARE-SHA256.txt
          make_latest: false
          overwrite_files: true
