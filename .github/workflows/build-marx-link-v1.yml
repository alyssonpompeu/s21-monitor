name: Build MARX LINK COREREV82

on:
  workflow_dispatch:
  push:
    branches: [ "marx-link-v1" ]
    paths:
      - '.github/workflows/build-marx-link-v1.yml'
      - 'bcm4375lab/**'
      - 'sdr-probe/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout MARX LINK branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          sudo apt-get update
          sudo apt-get install -y clang lld llvm unzip curl file python3

      - name: Obtain exact proven v3 BCM4375 firmware base
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/alyssonpompeu/s21-monitor/releases/download/rx42-fsi6-re-v3-github-latest/RX42-Control-FSi6-RE-v3-GITHUB-TPLRAM-TXOFF.apk"
          curl -fL --retry 3 "$URL" -o /tmp/rx42-v3.apk
          echo "e26308ac906f2648cb9249f1c69ef3fa51f54453ed3cb36cf4ff53c35242041f  /tmp/rx42-v3.apk" | sha256sum -c -
          mkdir -p /tmp/rx42-v3
          unzip -q /tmp/rx42-v3.apk assets/nexmon/bcmdhd_sta_rx42_tplram_probe_v2.bin -d /tmp/rx42-v3
          BASE=/tmp/rx42-v3/assets/nexmon/bcmdhd_sta_rx42_tplram_probe_v2.bin
          echo "15e3b2f6e29bf01c88b8670f2fcf4b40e02d947a2091af5243ddbf9b0dd69c44  $BASE" | sha256sum -c -
          stat -c 'BASE_SIZE=%s' "$BASE"

      - name: Build fixed-address COREREV82 firmware helper
        shell: bash
        run: |
          set -euo pipefail
          clang --target=armv7-none-eabi -mthumb -mcpu=cortex-m3 -Os -ffreestanding -fno-builtin \
            -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables \
            -c sdr-probe/marx_fw_helper.c -o /tmp/marx_fw_helper.o
          ld.lld -T sdr-probe/marx_fw.ld /tmp/marx_fw_helper.o -o /tmp/marx_fw_helper.elf
          llvm-objcopy -O binary /tmp/marx_fw_helper.elf /tmp/marx_fw_helper.bin
          clang --target=armv7-none-eabi -mthumb -mcpu=cortex-m3 -c sdr-probe/marx_tramp.S -o /tmp/marx_tramp.o
          ld.lld -T sdr-probe/marx_tramp.ld /tmp/marx_tramp.o -o /tmp/marx_tramp.elf
          llvm-objcopy -O binary /tmp/marx_tramp.elf /tmp/marx_tramp.bin
          stat -c 'HELPER_SIZE=%s' /tmp/marx_fw_helper.bin
          stat -c 'TRAMP_SIZE=%s' /tmp/marx_tramp.bin
          test "$(stat -c %s /tmp/marx_fw_helper.bin)" -le 2644
          test "$(stat -c %s /tmp/marx_tramp.bin)" -le 64
          llvm-objdump -d --triple=thumbv7m-none-eabi /tmp/marx_fw_helper.elf | head -80 || true
          llvm-objdump -d --triple=thumbv7m-none-eabi /tmp/marx_tramp.elf

      - name: Binary-patch v3 firmware without expanding Nexmon patch region
        shell: bash
        run: |
          set -euo pipefail
          BASE=/tmp/rx42-v3/assets/nexmon/bcmdhd_sta_rx42_tplram_probe_v2.bin
          OUT=bcm4375lab/src/main/assets/nexmon/bcmdhd_sta_marx_link_v1.bin
          mkdir -p "$(dirname "$OUT")"
          python3 sdr-probe/build_marx_binary.py "$BASE" /tmp/marx_fw_helper.bin /tmp/marx_tramp.bin "$OUT" | tee /tmp/marx-patch.txt
          sha256sum "$OUT" | tee marx-link-firmware-sha256.txt
          SHA=$(awk '{print $1}' marx-link-firmware-sha256.txt)
          test -n "$SHA"
          sed -i "s/MARX_LINK_V1_SHA/$SHA/g" bcm4375lab/src/main/java/com/alysson/bcm4375lab/MarxLinkActivity.java
          grep -n 'EXPECTED_SHA' bcm4375lab/src/main/java/com/alysson/bcm4375lab/MarxLinkActivity.java

      - name: Build ARM64 root tools
        shell: bash
        run: |
          set -euo pipefail
          python3 sdr-probe/patch_marx_userspace_markers.py bcm4375lab/native/marxlinkprobe.c
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          OUT=bcm4375lab/src/main/jniLibs/arm64-v8a
          mkdir -p "$OUT"
          "$CC" -O2 -fPIE -pie bcm4375lab/native/nexprobe.c -o "$OUT/libnexprobe.so"
          "$CC" -O2 -fPIE -pie bcm4375lab/native/sdrrx42probe.c -o "$OUT/libsdrrx42probe.so"
          "$CC" -O2 -fPIE -pie bcm4375lab/native/monrx.c -o "$OUT/libmonrx.so"
          "$CC" -O2 -D_GNU_SOURCE -fPIE -pie bcm4375lab/native/marxlinkprobe.c -lm -o "$OUT/libmarxlinkprobe.so"
          file "$OUT"/*.so
          test -x "$OUT/libmarxlinkprobe.so"
          strings "$OUT/libmarxlinkprobe.so" | grep 'MARX_PLAY_RESULT'
          strings "$OUT/libmarxlinkprobe.so" | grep 'TX_TRIGGERED'

      - name: Build installable MARX LINK APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :bcm4375lab:clean :bcm4375lab:assembleDebug --stacktrace
          test -s bcm4375lab/build/outputs/apk/debug/bcm4375lab-debug.apk

      - name: Verify APK signature, identity and embedded firmware
        shell: bash
        run: |
          set -euo pipefail
          APK=bcm4375lab/build/outputs/apk/debug/bcm4375lab-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING=$("$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | head -20 || true
          [[ "$BADGING" == *"package: name='com.alysson.marx.link.v1'"* ]]
          [[ "$BADGING" == *"versionName='1.0.0-link'"* ]]
          [[ "$BADGING" == *"application-label:'MARX LINK V1.0'"* ]]
          unzip -l "$APK" | grep 'assets/nexmon/bcmdhd_sta_marx_link_v1.bin'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libmarxlinkprobe.so'
          mkdir -p out
          cp "$APK" out/MARX-LINK-COREREV82-V1.apk
          sha256sum out/MARX-LINK-COREREV82-V1.apk | tee out/APK-SHA256.txt
          cp marx-link-firmware-sha256.txt out/FIRMWARE-SHA256.txt
          cp /tmp/marx-patch.txt out/PATCH-MAP.txt

      - name: Upload MARX LINK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MARX-LINK-COREREV82-V1
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Publish MARX LINK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: marx-link-corerev82-latest
          name: MARX LINK COREREV82 V1
          body: |
            Galaxy S21 BCM4375B1 / COREREV82 experimental AFHDS2A laboratory.

            This build no longer expands the PR663 Nexmon patch region. It starts
            from the previously built v3 firmware, injects a compact Thumb helper
            into a verified zero-filled patch-RAM gap, and redirects existing
            private IOCTL 0x630 to that helper.

            The helper exposes the modern D11AC XmtTemplateDataLo/Hi/Ptr and
            SamplePlayStart/Stop/Control path. Android performs IQ/GFSK generation.
            RF playback and AFHDS2A bind remain experimental until confirmed on the
            physical Galaxy S21 + MA-RX42; full bind is not claimed without RX-ID.
          files: |
            out/MARX-LINK-COREREV82-V1.apk
            out/APK-SHA256.txt
            out/FIRMWARE-SHA256.txt
            out/PATCH-MAP.txt
          make_latest: false
          overwrite_files: true
