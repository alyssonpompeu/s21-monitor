name: Build MARX A7105 V1.0

on:
  workflow_dispatch:
  push:
    branches: [ "marx-virtual-a7105-v1" ]
    paths:
      - '.github/workflows/build-marx-a7105-v1.yml'
      - 'bcm4375lab/**'
      - 'sdr-probe/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout MARX A7105 branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android NDK and Nexmon dependencies
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y git gawk qpdf flex libfl-dev bison xxd make patch python3 zlib1g-dev \
            libc6:i386 libstdc++6:i386 zlib1g:i386 libncurses5:i386

      - name: Clone exact Nexmon PR663 BCM4375B1 18.41.117
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/seemoo-lab/nexmon.git nexmon
          cd nexmon
          git fetch --depth 1 origin pull/663/head:pr663
          git checkout pr663
          test "$(git rev-parse HEAD)" = "fd117f434e1c479f6819a0ba31f9ca82d75f8a3a"
          sed -i 's/LDFLAGS[[:space:]]*+=[[:space:]]*-ll/LDFLAGS\t\t+= -lfl/' buildtools/b43/assembler/Makefile

      - name: Verify exact Samsung BCM4375B1 firmware base
        shell: bash
        run: |
          set -euo pipefail
          FW=nexmon/firmwares/bcm4375b1/18_41_117_sta/bcmdhd_sta.bin_b1
          ACTUAL=$(sha256sum "$FW" | awk '{print $1}')
          test "$ACTUAL" = "1676f46ce56b96f58dc70de08beaab4ab3362ee6dd751465a8d6a0023c3c54ad"
          echo "STOCK_SHA256=$ACTUAL"

      - name: Apply proven MARX 0x630 plus bounded 0x631 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 sdr-probe/patch_pr663.py nexmon/patches/bcm4375b1/18_41_117_sta/nexmon/src/ioctl.c
          grep -n -A8 -B2 'case 0x630' nexmon/patches/bcm4375b1/18_41_117_sta/nexmon/src/ioctl.c
          grep -n -A8 -B2 'case 0x631' nexmon/patches/bcm4375b1/18_41_117_sta/nexmon/src/ioctl.c

      - name: Build patched Nexmon firmware
        shell: bash
        run: |
          set -euo pipefail
          cd nexmon
          source setup_env.sh
          make -j2
          cd patches/bcm4375b1/18_41_117_sta/nexmon
          make init
          make -j1
          test -s bcmdhd_sta.bin_b1
          mkdir -p "$GITHUB_WORKSPACE/bcm4375lab/src/main/assets/nexmon"
          cp bcmdhd_sta.bin_b1 "$GITHUB_WORKSPACE/bcm4375lab/src/main/assets/nexmon/bcmdhd_sta_marx_tplram_v1.bin"
          sha256sum bcmdhd_sta.bin_b1 | tee "$GITHUB_WORKSPACE/marx-a7105-firmware-sha256.txt"

      - name: Pin generated firmware SHA in Android
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(awk '{print $1}' marx-a7105-firmware-sha256.txt)
          test -n "$SHA"
          sed -i "s/MARX_TPLRAM_V1_SHA/$SHA/g" bcm4375lab/src/main/java/com/alysson/bcm4375lab/Rx42PhyProbeV1Activity.java
          grep -n 'EXPECTED_SHA' bcm4375lab/src/main/java/com/alysson/bcm4375lab/Rx42PhyProbeV1Activity.java

      - name: Build ARM64 root tools
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          test -x "$CC"
          OUT=bcm4375lab/src/main/jniLibs/arm64-v8a
          mkdir -p "$OUT"
          "$CC" -O2 -fPIE -pie bcm4375lab/native/nexprobe.c -o "$OUT/libnexprobe.so"
          "$CC" -O2 -fPIE -pie bcm4375lab/native/sdrrx42probe.c -o "$OUT/libsdrrx42probe.so"
          "$CC" -O2 -fPIE -pie bcm4375lab/native/monrx.c -o "$OUT/libmonrx.so"
          "$CC" -O2 -D_GNU_SOURCE -fPIE -pie bcm4375lab/native/marxa7105probe.c -lm -o "$OUT/libmarxa7105probe.so"
          file "$OUT"/*.so
          test -x "$OUT/libmarxa7105probe.so"
          strings "$OUT/libmarxa7105probe.so" | grep 'VIRTUAL_A7105=READY'
          strings "$OUT/libmarxa7105probe.so" | grep 'WLC_PHY_SAMPLE_COLLECT=307'
          strings "$OUT/libmarxa7105probe.so" | grep 'ARBITRARY_TX_BACKEND='

      - name: Build installable APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :bcm4375lab:clean :bcm4375lab:assembleDebug --stacktrace
          test -s bcm4375lab/build/outputs/apk/debug/bcm4375lab-debug.apk

      - name: Verify APK signature identity launcher and assets
        shell: bash
        run: |
          set -euo pipefail
          APK=bcm4375lab/build/outputs/apk/debug/bcm4375lab-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING=$("$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | head -25 || true
          [[ "$BADGING" == *"package: name='com.alysson.marx.a7105.v1'"* ]]
          [[ "$BADGING" == *"versionName='1.0.0-a7105'"* ]]
          [[ "$BADGING" == *"launchable-activity: name='com.alysson.bcm4375lab.MarxA7105Activity'"* ]]
          unzip -l "$APK" | grep 'assets/nexmon/bcmdhd_sta_marx_tplram_v1.bin'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libmarxa7105probe.so'
          mkdir -p out
          cp "$APK" out/MARX-A7105-V1.0.apk
          sha256sum out/MARX-A7105-V1.0.apk | tee out/APK-SHA256.txt
          cp marx-a7105-firmware-sha256.txt out/FIRMWARE-SHA256.txt

      - name: Upload MARX A7105 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MARX-A7105-V1.0
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Publish MARX A7105 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: marx-a7105-v1-latest
          name: MARX A7105 V1.0
          body: |
            Integrated Galaxy S21 / BCM4375B1 / FlySky AFHDS2A laboratory.

            Architecture:
              FS-i6 reverse profile -> Virtual A7105 -> AFHDS2A -> GFSK/IQ -> BCM4375 backend.

            Includes bounded diagnostics for root/kernel/DHD, Nexmon PR663 transport,
            Broadcom WLC_PHY_SAMPLE_COLLECT (307) RX-path probing, the previously proven
            0x630 register probe, and a gated backend readiness check.

            This release does not claim a successful arbitrary-RF backend or receiver bind.
            Link transmission remains blocked unless the backend explicitly reports a verified
            arbitrary-TX capability, and full bind additionally requires a real RX reply/RX ID.
          files: |
            out/MARX-A7105-V1.0.apk
            out/APK-SHA256.txt
            out/FIRMWARE-SHA256.txt
          make_latest: false
          overwrite_files: true
