name: Build BCM4375 SDR Probe Firmware

on:
  push:
    branches: [ "bcm4375-sdr-probe-v1" ]
    paths:
      - '.github/workflows/build-nexmon-sdr-probe.yml'
      - 'sdr-probe/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/build-nexmon-sdr-probe.yml'
      - 'sdr-probe/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y git gawk qpdf flex libfl-dev bison xxd make patch python3 zlib1g-dev \
            libc6:i386 libstdc++6:i386 zlib1g:i386 libncurses5:i386

      - name: Clone exact PR663 target
        run: |
          git clone --depth 1 https://github.com/seemoo-lab/nexmon.git nexmon
          cd nexmon
          git fetch --depth 1 origin pull/663/head:pr663
          git checkout pr663
          test "$(git rev-parse HEAD)" = "fd117f434e1c479f6819a0ba31f9ca82d75f8a3a"
          sed -i 's/LDFLAGS[[:space:]]*+=[[:space:]]*-ll/LDFLAGS\t\t+= -lfl/' buildtools/b43/assembler/Makefile

      - name: Add read-only BCM4375 sample-playback register probe
        run: |
          cd nexmon
          python3 - <<'PY'
          from pathlib import Path
          p = Path('patches/bcm4375b1/18_41_117_sta/nexmon/src/ioctl.c')
          s = p.read_text()
          marker = '        case 0x621:\n'
          assert marker in s, 'PR663 ioctl insertion point changed'
          block = r'''        case 0x630: // RX42/BCM4375 read-only SDR register probe
        {
            volatile struct d11regs *regs = wlc->regs;
            argprintf("RX42_SDR_PROBE=1\n");
            argprintf("COREREV=%u\n", wlc->hw ? wlc->hw->corerev : 0xffffffff);
            argprintf("CHANSPEC=0x%04x\n", wlc->chanspec);
            argprintf("MONITOR=0x%08x\n", wlc->monitor);
            if (regs) {
                argprintf("SMPL_CLCT_STRPTR=0x%04x\n", regs->u.d11acregs.smpl_clct_strptr);
                argprintf("SMPL_CLCT_STPPTR=0x%04x\n", regs->u.d11acregs.smpl_clct_stpptr);
                argprintf("SMPL_CLCT_CURPTR=0x%04x\n", regs->u.d11acregs.smpl_clct_curptr);
                argprintf("SAMPLE_PLAY_CTRL=0x%04x\n", regs->u.d11acregs.SampleCollectPlayCtrl);
                argprintf("XMT_TEMPLATE_PTR=0x%04x\n", regs->u.d11acregs.xmttplateptr);
                argprintf("SDR_REGISTER_BLOCK=ACCESSIBLE\n");
            } else {
                argprintf("SDR_REGISTER_BLOCK=NULL\n");
            }
            argprintf("TX_ENABLED_BY_THIS_PROBE=0\n");
            ret = IOCTL_SUCCESS;
        }
        break;

'''
          p.write_text(s.replace(marker, block + marker, 1))
          PY
          grep -n -A30 -B3 'case 0x630' patches/bcm4375b1/18_41_117_sta/nexmon/src/ioctl.c

      - name: Verify stock firmware identity
        run: |
          test "$(sha256sum nexmon/firmwares/bcm4375b1/18_41_117_sta/bcmdhd_sta.bin_b1 | cut -d' ' -f1)" = "1676f46ce56b96f58dc70de08beaab4ab3362ee6dd751465a8d6a0023c3c54ad"

      - name: Build Nexmon and experimental firmware
        shell: bash
        run: |
          cd nexmon
          source setup_env.sh
          make -j2
          cd patches/bcm4375b1/18_41_117_sta/nexmon
          make init
          make -j1
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp bcmdhd_sta.bin_b1 "$GITHUB_WORKSPACE/out/bcmdhd_sta_rx42_sdr_probe_v1.bin"
          sha256sum bcmdhd_sta.bin_b1 | tee "$GITHUB_WORKSPACE/out/sha256.txt"
          cp log/compiler.log "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          cp log/linker.err "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          strings -a bcmdhd_sta.bin_b1 | grep -E '18\.41\.117|nexmon.org' | tail -20 > "$GITHUB_WORKSPACE/out/strings.txt" || true

      - uses: actions/upload-artifact@v4
        with:
          name: BCM4375-RX42-SDR-Probe-v1
          path: out/
