name: Build Unilaw AI v8 Full Workspace

on:
  push:
    branches: [ "feature/unilaw-full-workspace-v8" ]
    paths:
      - 'scripts/apply_workspace_v8_full_suite.py'
      - '.github/workflows/build-unilaw-v8-full-workspace.yml'
      - 'docs/V8-FULL-WORKSPACE-ARCHITECTURE.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v8:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      LLAMA_CPP_COMMIT: 153d324bcf86d220b235ca010eeb11213f32b5d1
      V71_RELEASE_BASE: https://github.com/alyssonpompeu/s21-monitor/releases/download/offline-ai-corepacks-v7-1-recovery
      V71_CORE_SHA256: 588e4cde917891b20c542cb665148ba511741ceec5c3b14926f8fcfc4782c66e
      QWEN_MODEL_SHA256: aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip file
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Pin llama.cpp and tune Exynos 2100
        shell: bash
        run: |
          rm -rf vendor/llama.cpp
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git vendor/llama.cpp
          git -C vendor/llama.cpp checkout "$LLAMA_CPP_COMMIT"
          git -C vendor/llama.cpp submodule update --init --recursive
          python3 - <<'PY'
          from pathlib import Path
          native = Path('vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp')
          text = native.read_text(encoding='utf-8')
          replacements = {
              'constexpr int   N_THREADS_MAX           = 4;': 'constexpr int   N_THREADS_MAX           = 3;',
              'constexpr int   DEFAULT_CONTEXT_SIZE    = 8192;': 'constexpr int   DEFAULT_CONTEXT_SIZE    = 4096;',
              'constexpr int   BATCH_SIZE              = 512;': 'constexpr int   BATCH_SIZE              = 128;',
              'constexpr float DEFAULT_SAMPLER_TEMP    = 0.3f;': 'constexpr float DEFAULT_SAMPLER_TEMP    = 0.75f;',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Pinned ai_chat.cpp mismatch: {old}')
              text = text.replace(old, new, 1)
          native.write_text(text, encoding='utf-8')

          activity = Path('offlineai/src/main/java/com/alysson/offlineai/MainActivity.kt')
          app = activity.read_text(encoding='utf-8')
          for old, new in {
              'Qwen3.5-0.8B-Q4_K_M.gguf': 'Qwen3.5-2B-Q4_K_M.gguf',
              'bd258782e35f7f458f8aced1adc053e6e92e89bc735ba3be89d38a06121dc517': 'aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223',
          }.items():
              if old not in app: raise SystemExit(f'Model marker missing: {old}')
              app = app.replace(old, new, 1)
          activity.write_text(app, encoding='utf-8')
          PY

      - name: Apply Workspace lineage through v8
        shell: bash
        run: |
          python3 scripts/apply_workspace_v2_ui.py
          python3 scripts/apply_workspace_v3.py
          GITHUB_ACTIONS=false python3 scripts/apply_workspace_v4.py
          python3 scripts/apply_workspace_v5.py
          python3 scripts/apply_builder_install_fix_v51.py
          python3 scripts/apply_workspace_v52.py
          python3 scripts/apply_workspace_v521.py
          python3 scripts/apply_workspace_v53.py
          python3 scripts/apply_workspace_v531.py
          python3 scripts/apply_workspace_v6_exynos.py
          python3 scripts/apply_workspace_v7_corepacks.py
          python3 scripts/apply_workspace_v71_bootfix.py
          python3 scripts/apply_workspace_v72_s21_firmware.py
          python3 scripts/apply_workspace_v8_full_suite.py

      - name: Reuse verified runtime assets
        shell: bash
        run: |
          mkdir -p build/v71-reuse offlineai/src/main/assets offlineai/src/main/jniLibs/arm64-v8a
          curl -L --fail --retry 8 --retry-delay 5 "$V71_RELEASE_BASE/Unilaw-AI-Core-S21-v7-1-Recovery.apk" -o build/v71-reuse/v71.apk
          echo "$V71_CORE_SHA256  build/v71-reuse/v71.apk" | sha256sum -c -
          unzip -p build/v71-reuse/v71.apk assets/ptbr_memory.db > offlineai/src/main/assets/ptbr_memory.db
          unzip -p build/v71-reuse/v71.apk assets/plugin_pubkey.der > offlineai/src/main/assets/plugin_pubkey.der
          unzip -p build/v71-reuse/v71.apk assets/plugin_pubkey_v7.der > offlineai/src/main/assets/plugin_pubkey_v7.der
          unzip -p build/v71-reuse/v71.apk lib/arm64-v8a/libsd-cli.so > offlineai/src/main/jniLibs/arm64-v8a/libsd-cli.so
          unzip -p build/v71-reuse/v71.apk lib/arm64-v8a/libsd-vulkan.so > offlineai/src/main/jniLibs/arm64-v8a/libsd-vulkan.so
          chmod 755 offlineai/src/main/jniLibs/arm64-v8a/libsd-cli.so offlineai/src/main/jniLibs/arm64-v8a/libsd-vulkan.so
          test ! -e offlineai/src/main/assets/model.gguf

      - name: Verify v8 source invariants
        shell: bash
        run: |
          grep -q 'AUTO("Conversar • Auto")' offlineai/src/main/java/com/alysson/offlineai/MainActivity.kt
          grep -q 'WORK_OFFLINE("Work • Offline")' offlineai/src/main/java/com/alysson/offlineai/MainActivity.kt
          grep -q 'WORK_ONLINE("Work • Online")' offlineai/src/main/java/com/alysson/offlineai/MainActivity.kt
          grep -q 'class SmartCapabilityRouter' offlineai/src/main/java/com/alysson/offlineai/SmartCapabilityRouter.kt
          grep -q 'object BuiltInPluginRegistry' offlineai/src/main/java/com/alysson/offlineai/BuiltInPluginRegistry.kt
          grep -q "versionName '8.0.0-full-workspace'" offlineai/build.gradle
          grep -q 'EXPECTED_KERNEL = "5.4.242-30958140-abG991BXXSJHZA6"' offlineai/src/main/java/com/alysson/offlineai/S21KernelProfile.kt

      - name: Record v8 manifest
        shell: bash
        run: |
          cat > offlineai/src/main/assets/source_manifest.json <<EOF
          {
            "variant": "v8-full-workspace",
            "target_device": "Samsung Galaxy S21 5G SM-G991B",
            "soc": "Exynos 2100",
            "kernel_profile": "5.4.242-30958140-abG991BXXSJHZA6",
            "runtime": "llama.cpp ARM64, 3 workers, ctx 4096, batch 128",
            "builtin_plugins": "exact-tools, local-search, OCR, universal-reader, apk/binary/log analysis, backup, image-tools, S21 hardware",
            "routing": "automatic local capability router",
            "work_offline": true,
            "work_online": "separate companion APK",
            "internet_permission_in_core": false,
            "model_delivery": "signed iapack outside Core APK"
          }
          EOF

      - name: Build v8 physical-test APK
        id: build_apk
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle :offlineai:assembleDebug --stacktrace --no-daemon 2>&1 | tee unilaw-v8-build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            tail -n 1500 unilaw-v8-build.log > unilaw-v8-last-build-error.txt
            cat unilaw-v8-last-build-error.txt
            exit "$STATUS"
          fi
          cp offlineai/build/outputs/apk/debug/offlineai-debug.apk Unilaw-AI-Workspace-S21-v8.apk
          sha256sum Unilaw-AI-Workspace-S21-v8.apk | tee Unilaw-AI-Workspace-S21-v8.apk.sha256

      - name: Verify APK
        shell: bash
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APK="Unilaw-AI-Workspace-S21-v8.apk"
          "$AAPT" dump badging "$APK" | tee build/v8-badging.txt
          grep -q "package: name='com.alysson.offlineai.pluginv52'" build/v8-badging.txt
          grep -q "versionName='8.0.0-full-workspace'" build/v8-badging.txt
          grep -q "native-code: 'arm64-v8a'" build/v8-badging.txt
          if unzip -l "$APK" | grep -q 'assets/model.gguf'; then
            echo 'ERROR: heavy Qwen payload was bundled back into Core.' >&2
            exit 1
          fi
          if "$AAPT" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo 'ERROR: Core gained INTERNET permission.' >&2
            exit 1
          fi

      - name: Upload diagnostics
        if: failure() && steps.build_apk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unilaw-v8-diagnostics
          path: |
            unilaw-v8-build.log
            unilaw-v8-last-build-error.txt
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: Unilaw-AI-Workspace-S21-v8
          path: |
            Unilaw-AI-Workspace-S21-v8.apk
            Unilaw-AI-Workspace-S21-v8.apk.sha256
          compression-level: 0

      - name: Publish v8 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: offline-ai-workspace-v8
          name: Unilaw AI Workspace v8 • S21
          body: |
            Workspace diário com interface Work Offline/Online e roteamento automático de plugins.

            Plugins leves e ferramentas são compilados no Core. Qwen/Coder/Tiny-SD continuam como packs neurais assinados para evitar um APK monolítico de mais de 3 GiB e preservar estabilidade no SM-G991B.

            O APK Core não possui INTERNET. Work Online continua em companion separado. O Work Offline usa Qwen + projeto + Biblioteca Neural.
          files: |
            Unilaw-AI-Workspace-S21-v8.apk
            Unilaw-AI-Workspace-S21-v8.apk.sha256
          make_latest: false
          overwrite_files: true
