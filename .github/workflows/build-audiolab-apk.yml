name: Build G991B Audio Lab APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "audio-lab-v1" ]
    paths:
      - 'audiolab/**'
      - 'settings.gradle'
      - '.github/workflows/build-audiolab-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle :audiolab:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp audiolab/build/outputs/apk/debug/audiolab-debug.apk G991B-Audio-Lab-v1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: G991B-Audio-Lab-v1.0-APK
          path: G991B-Audio-Lab-v1.0.apk
