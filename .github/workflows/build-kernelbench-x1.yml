name: Build S21 Lab History APK

on:
  workflow_dispatch:
  push:
    branches: [ "s21-kernelbench-x1" ]
    paths:
      - 's21bench/**'
      - 's21lab/**'
      - 'settings.gradle'
      - '.github/workflows/build-kernelbench-x1.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reuse exact S21Lab benchmark engines
        run: |
          sed 's/package com.alysson.s21lab;/package com.alysson.kernelbench;/' s21lab/src/main/java/com/alysson/s21lab/Benchmarks.java > s21bench/src/main/java/com/alysson/kernelbench/Benchmarks.java
          sed 's/package com.alysson.s21lab;/package com.alysson.kernelbench;/' s21lab/src/main/java/com/alysson/s21lab/GpuBench.java > s21bench/src/main/java/com/alysson/kernelbench/GpuBench.java
          sed 's/package com.alysson.s21lab;/package com.alysson.kernelbench;/' s21lab/src/main/java/com/alysson/s21lab/RootTelemetry.java > s21bench/src/main/java/com/alysson/kernelbench/RootTelemetry.java

      - name: Verify no 3DMark normalization remains
        run: |
          if grep -R -n -E '1940|Wild Life|normalizeGpu|GPU_REFERENCE_SCORE' s21bench/src/main/java; then
            echo 'Forbidden external-score normalization found.'
            exit 1
          fi

      - name: Build S21 Lab History
        run: gradle :s21bench:assembleDebug --stacktrace

      - name: Normalize APK name
        run: cp s21bench/build/outputs/apk/debug/s21bench-debug.apk S21-Lab-History-v1.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: S21-Lab-History-v1.0
          path: S21-Lab-History-v1.0.apk
