name: Build Unilaw AI S21 Native v6

on:
  workflow_dispatch:
  push:
    branches: [ "feature/offline-ptbr-ai-s21-native-v6" ]
    paths-ignore:
      - 'offlineai-s21-v6-last-successful-build.txt'

permissions:
  contents: write

jobs:
  build-s21-native-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      LLAMA_CPP_COMMIT: 153d324bcf86d220b235ca010eeb11213f32b5d1
      V531_APK_SHA256: c6b08aa5890f605b6221a93a8b0747ae2c4a3bd2deab9f6ec7780aa629790aa6
      V531_RELEASE_BASE: https://github.com/alyssonpompeu/s21-monitor/releases/download/offline-ai-plugin-platform-v5-3-1
      QWEN_MODEL_FILE: Qwen3.5-2B-Q4_K_M.gguf
      QWEN_MODEL_SHA256: aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223

    steps:
      - name: Checkout S21 Native v6
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip file
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Pin llama.cpp and tune Exynos 2100 CPU runtime
        shell: bash
        run: |
          rm -rf vendor/llama.cpp
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git vendor/llama.cpp
          git -C vendor/llama.cpp checkout "$LLAMA_CPP_COMMIT"
          git -C vendor/llama.cpp submodule update --init --recursive
          python3 - <<'PY'
          from pathlib import Path
          native = Path('vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp')
          text = native.read_text(encoding='utf-8')
          replacements = {
              'constexpr int   N_THREADS_MAX           = 4;': 'constexpr int   N_THREADS_MAX           = 3;',
              'constexpr int   DEFAULT_CONTEXT_SIZE    = 8192;': 'constexpr int   DEFAULT_CONTEXT_SIZE    = 4096;',
              'constexpr int   BATCH_SIZE              = 512;': 'constexpr int   BATCH_SIZE              = 128;',
              'constexpr float DEFAULT_SAMPLER_TEMP    = 0.3f;': 'constexpr float DEFAULT_SAMPLER_TEMP    = 0.75f;',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Pinned ai_chat.cpp no longer matches expected point: {old}')
              text = text.replace(old, new, 1)
          native.write_text(text, encoding='utf-8')

          activity = Path('offlineai/src/main/java/com/alysson/offlineai/MainActivity.kt')
          app = activity.read_text(encoding='utf-8')
          markers = {
              'Qwen3.5-0.8B-Q4_K_M.gguf': 'Qwen3.5-2B-Q4_K_M.gguf',
              'bd258782e35f7f458f8aced1adc053e6e92e89bc735ba3be89d38a06121dc517': 'aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223',
          }
          for old, new in markers.items():
              if old not in app:
                  raise SystemExit(f'MainActivity model marker missing: {old}')
              app = app.replace(old, new, 1)
          activity.write_text(app, encoding='utf-8')
          PY

      - name: Apply Workspace lineage and S21 Native v6 patch
        shell: bash
        run: |
          python3 scripts/apply_workspace_v2_ui.py
          python3 scripts/apply_workspace_v3.py
          GITHUB_ACTIONS=false python3 scripts/apply_workspace_v4.py
          python3 scripts/apply_workspace_v5.py
          python3 scripts/apply_builder_install_fix_v51.py
          python3 scripts/apply_workspace_v52.py
          python3 scripts/apply_workspace_v521.py
          python3 scripts/apply_workspace_v53.py
          python3 scripts/apply_workspace_v531.py
          python3 scripts/apply_workspace_v6_exynos.py

      - name: Reuse verified v5.3.1 neural assets and image engines
        shell: bash
        run: |
          mkdir -p build/v531-reuse offlineai/src/main/assets offlineai/src/main/jniLibs/arm64-v8a
          curl -L --fail --retry 8 --retry-delay 5 \
            "$V531_RELEASE_BASE/IA-Offline-Plugin-v5-3-1-S21.apk" -o build/v531-reuse/v531.apk
          echo "$V531_APK_SHA256  build/v531-reuse/v531.apk" | sha256sum -c -

          unzip -p build/v531-reuse/v531.apk assets/model.gguf > offlineai/src/main/assets/model.gguf
          echo "$QWEN_MODEL_SHA256  offlineai/src/main/assets/model.gguf" | sha256sum -c -
          unzip -p build/v531-reuse/v531.apk assets/ptbr_memory.db > offlineai/src/main/assets/ptbr_memory.db
          unzip -p build/v531-reuse/v531.apk assets/plugin_pubkey.der > offlineai/src/main/assets/plugin_pubkey.der
          unzip -p build/v531-reuse/v531.apk lib/arm64-v8a/libsd-cli.so > offlineai/src/main/jniLibs/arm64-v8a/libsd-cli.so
          unzip -p build/v531-reuse/v531.apk lib/arm64-v8a/libsd-vulkan.so > offlineai/src/main/jniLibs/arm64-v8a/libsd-vulkan.so
          chmod 755 offlineai/src/main/jniLibs/arm64-v8a/libsd-cli.so offlineai/src/main/jniLibs/arm64-v8a/libsd-vulkan.so
          test -s offlineai/src/main/assets/model.gguf
          test -s offlineai/src/main/assets/ptbr_memory.db
          test -s offlineai/src/main/assets/plugin_pubkey.der
          test -s offlineai/src/main/jniLibs/arm64-v8a/libsd-cli.so
          test -s offlineai/src/main/jniLibs/arm64-v8a/libsd-vulkan.so

      - name: Reuse verified v5.3.1 plugins and Work Free
        shell: bash
        run: |
          for FILE in \
            Developer-Builder-Core-v1.iapack \
            Developer-Builder-Core-v1.iapack.sha256 \
            Coder-Qwen2.5-1.5B-Q4KM.iapack \
            Coder-Qwen2.5-1.5B-Q4KM.iapack.sha256 \
            Work-Free-v2.apk \
            Work-Free-v2.apk.sha256; do
            curl -L --fail --retry 8 --retry-delay 5 "$V531_RELEASE_BASE/$FILE" -o "$FILE"
          done
          sha256sum -c Developer-Builder-Core-v1.iapack.sha256
          sha256sum -c Coder-Qwen2.5-1.5B-Q4KM.iapack.sha256
          sha256sum -c Work-Free-v2.apk.sha256

      - name: Record S21-native source manifest
        shell: bash
        run: |
          cat > offlineai/src/main/assets/source_manifest.json <<EOF
          {
            "variant": "s21-native-v6",
            "language": "pt-BR",
            "target_device": "Samsung Galaxy S21 5G SM-G991B",
            "soc": "Exynos 2100",
            "runtime": "llama.cpp + Android framework Views",
            "llama_cpp_commit": "$LLAMA_CPP_COMMIT",
            "main_model": "$QWEN_MODEL_FILE",
            "main_model_sha256": "$QWEN_MODEL_SHA256",
            "ui": "native framework Views, light/dark/system palettes, edge-to-edge, no Compose/AppCompat runtime",
            "anr_strategy": "model loading and inference upstream on worker dispatcher; frame-batched UI token flush",
            "root_strategy": "opt-in runtime sysfs discovery; max-frequency caps only; no overclock, voltage, governor, LMKD or zRAM writes",
            "package_policy": "applicationId com.alysson.offlineai.pluginv52 remains stable for projects/plugins/settings"
          }
          EOF

      - name: Build optimized S21 Native APK
        id: build_apk
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle :offlineai:assembleDebug --stacktrace --no-daemon 2>&1 | tee offlineai-s21-v6-build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path('offlineai-s21-v6-build.log').read_text(encoding='utf-8', errors='replace').splitlines()
          patterns = re.compile(r'(error:|fatal error:|CMake Error|FAILED:|ninja:|Execution failed|BUILD FAILED|What went wrong|Caused by:|e: file:)')
          hits = [i for i, line in enumerate(src) if patterns.search(line)]
          selected = set()
          for i in hits:
              selected.update(range(max(0, i - 14), min(len(src), i + 50)))
          lines = [src[i] for i in sorted(selected)] or src[-1000:]
          Path('offlineai-s21-v6-last-build-error.txt').write_text('\n'.join(lines[-1600:]) + '\n', encoding='utf-8')
          PY
            cat offlineai-s21-v6-last-build-error.txt
            exit "$STATUS"
          fi
          cp offlineai/build/outputs/apk/debug/offlineai-debug.apk Unilaw-AI-S21-v6.apk
          sha256sum Unilaw-AI-S21-v6.apk | tee Unilaw-AI-S21-v6.apk.sha256
          ls -lh Unilaw-AI-S21-v6.apk

      - name: Verify APK identity and architecture
        shell: bash
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APK="Unilaw-AI-S21-v6.apk"
          "$AAPT" dump badging "$APK" | tee build/v6-badging.txt
          grep -q "package: name='com.alysson.offlineai.pluginv52'" build/v6-badging.txt
          grep -q "native-code: 'arm64-v8a'" build/v6-badging.txt
          unzip -l "$APK" | grep -q 'assets/model.gguf'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          unzip -l "$APK" | grep -q 'assets/dexopt/baseline.prof' || echo "Baseline profile binary may be installed/generated by AGP/profileinstaller at install/runtime."

      - name: Upload v6 diagnostics
        if: failure() && steps.build_apk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unilaw-ai-s21-v6-build-diagnostics
          path: |
            offlineai-s21-v6-last-build-error.txt
            offlineai-s21-v6-build.log
          retention-days: 7

      - name: Upload S21 Native APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unilaw-AI-S21-v6
          path: |
            Unilaw-AI-S21-v6.apk
            Unilaw-AI-S21-v6.apk.sha256
          compression-level: 0

      - name: Publish S21 Native v6
        uses: softprops/action-gh-release@v2
        with:
          tag_name: offline-ai-s21-native-v6
          name: Unilaw AI S21 Native v6
          body: |
            Refatoração de desempenho direcionada ao Samsung Galaxy S21 5G SM-G991B / Exynos 2100.

            - Carregamento da rede neural transferido para worker dispatcher para evitar ANR no thread principal.
            - Streaming visual agrupado em ~32 ms para reduzir relayouts por token.
            - Interface Android nativa leve, sem Compose/AppCompat, com temas Sistema/Claro/Escuro.
            - Edge-to-edge/insets para targetSdk 35.
            - R8/shrinkResources também no APK de teste.
            - Baseline/Startup profile com caminhos críticos da UI.
            - Descoberta dinâmica do kernel/cpufreq/devfreq.
            - Controle root opcional e conservador no SM-G991B: somente limite máximo dentro das frequências stock detectadas; sem overclock/voltagem/governor/LMKD/zRAM.
            - Mesmo applicationId da v5.2+ para preservar dados quando a assinatura instalada permitir atualização in-place.
            - Work Free permanece companion separado com Internet.
          files: |
            Unilaw-AI-S21-v6.apk
            Unilaw-AI-S21-v6.apk.sha256
            Work-Free-v2.apk
            Work-Free-v2.apk.sha256
            Developer-Builder-Core-v1.iapack
            Developer-Builder-Core-v1.iapack.sha256
            Coder-Qwen2.5-1.5B-Q4KM.iapack
            Coder-Qwen2.5-1.5B-Q4KM.iapack.sha256
          make_latest: false
          overwrite_files: true

      - name: Record successful build
        if: success()
        shell: bash
        run: |
          printf '%s\n' "$(date -u +%FT%TZ) • ${GITHUB_SHA} • Unilaw AI S21 Native v6 build/release succeeded" > offlineai-s21-v6-last-successful-build.txt
