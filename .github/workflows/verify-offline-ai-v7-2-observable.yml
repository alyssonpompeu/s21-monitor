name: Observable Verify Unilaw v7.2

on:
  push:
    branches: [ "feature/unilaw-s21-firmware-tuned-v7-2" ]
    paths:
      - 'scripts/apply_workspace_v72_s21_firmware.py'
      - '.github/workflows/verify-offline-ai-v7-2-observable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LLAMA_CPP_COMMIT: 153d324bcf86d220b235ca010eeb11213f32b5d1
      V71_CORE_URL: https://github.com/alyssonpompeu/s21-monitor/releases/download/offline-ai-corepacks-v7-1-recovery/Unilaw-AI-Core-S21-v7-1-Recovery.apk
      V71_CORE_SHA256: 588e4cde917891b20c542cb665148ba511741ceec5c3b14926f8fcfc4782c66e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unilaw-s21-firmware-tuned-v7-2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Toolchain
        id: toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail; yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true; set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Native runtime
        id: native
        shell: bash
        run: |
          rm -rf vendor/llama.cpp
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git vendor/llama.cpp
          git -C vendor/llama.cpp checkout "$LLAMA_CPP_COMMIT"
          git -C vendor/llama.cpp submodule update --init --recursive
          python3 - <<'PY'
          from pathlib import Path
          p=Path('vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp'); s=p.read_text()
          for a,b in {
            'constexpr int   N_THREADS_MAX           = 4;':'constexpr int   N_THREADS_MAX           = 3;',
            'constexpr int   DEFAULT_CONTEXT_SIZE    = 8192;':'constexpr int   DEFAULT_CONTEXT_SIZE    = 4096;',
            'constexpr int   BATCH_SIZE              = 512;':'constexpr int   BATCH_SIZE              = 128;',
            'constexpr float DEFAULT_SAMPLER_TEMP    = 0.3f;':'constexpr float DEFAULT_SAMPLER_TEMP    = 0.75f;',
          }.items():
            assert a in s, a; s=s.replace(a,b,1)
          p.write_text(s)
          p=Path('offlineai/src/main/java/com/alysson/offlineai/MainActivity.kt'); s=p.read_text()
          for a,b in {
            'Qwen3.5-0.8B-Q4_K_M.gguf':'Qwen3.5-2B-Q4_K_M.gguf',
            'bd258782e35f7f458f8aced1adc053e6e92e89bc735ba3be89d38a06121dc517':'aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223',
          }.items():
            assert a in s, a; s=s.replace(a,b,1)
          p.write_text(s)
          PY
      - name: Apply lineage
        id: lineage
        shell: bash
        run: |
          python3 scripts/apply_workspace_v2_ui.py
          python3 scripts/apply_workspace_v3.py
          GITHUB_ACTIONS=false python3 scripts/apply_workspace_v4.py
          python3 scripts/apply_workspace_v5.py
          python3 scripts/apply_builder_install_fix_v51.py
          python3 scripts/apply_workspace_v52.py
          python3 scripts/apply_workspace_v521.py
          python3 scripts/apply_workspace_v53.py
          python3 scripts/apply_workspace_v531.py
          python3 scripts/apply_workspace_v6_exynos.py
          python3 scripts/apply_workspace_v7_corepacks.py
          python3 scripts/apply_workspace_v71_bootfix.py
          python3 scripts/apply_workspace_v72_s21_firmware.py
      - name: Runtime assets
        id: assets
        shell: bash
        run: |
          mkdir -p build/reuse offlineai/src/main/assets offlineai/src/main/jniLibs/arm64-v8a
          curl -L --fail --retry 8 --retry-delay 4 "$V71_CORE_URL" -o build/reuse/v71.apk
          echo "$V71_CORE_SHA256  build/reuse/v71.apk" | sha256sum -c -
          unzip -p build/reuse/v71.apk assets/ptbr_memory.db > offlineai/src/main/assets/ptbr_memory.db
          unzip -p build/reuse/v71.apk assets/plugin_pubkey.der > offlineai/src/main/assets/plugin_pubkey.der
          unzip -p build/reuse/v71.apk assets/plugin_pubkey_v7.der > offlineai/src/main/assets/plugin_pubkey_v7.der
          unzip -p build/reuse/v71.apk lib/arm64-v8a/libsd-cli.so > offlineai/src/main/jniLibs/arm64-v8a/libsd-cli.so
          unzip -p build/reuse/v71.apk lib/arm64-v8a/libsd-vulkan.so > offlineai/src/main/jniLibs/arm64-v8a/libsd-vulkan.so
          chmod 755 offlineai/src/main/jniLibs/arm64-v8a/libsd-*.so
          rm -f offlineai/src/main/assets/model.gguf
          printf '{"variant":"v7.2-observable","kernel":"5.4.242-30958140-abG991BXXSJHZA6"}\n' > offlineai/src/main/assets/source_manifest.json
      - name: Compile
        id: compile
        shell: bash
        run: |
          set -o pipefail
          gradle :offlineai:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/unilaw-v72-build.log
          APK=offlineai/build/outputs/apk/debug/offlineai-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/unilaw-v72-badging.txt
          grep -q "package: name='com.alysson.offlineai.pluginv52'" /tmp/unilaw-v72-badging.txt
          grep -q "versionName='7.2.0-s21-firmware-tuned'" /tmp/unilaw-v72-badging.txt
          grep -q "native-code: 'arm64-v8a'" /tmp/unilaw-v72-badging.txt
          if unzip -l "$APK" | grep -q 'assets/model.gguf'; then exit 1; fi
          sha256sum "$APK" > /tmp/unilaw-v72-apk.sha256
      - name: Commit observable result
        if: always()
        shell: bash
        env:
          TOOLCHAIN: ${{ steps.toolchain.outcome }}
          NATIVE: ${{ steps.native.outcome }}
          LINEAGE: ${{ steps.lineage.outcome }}
          ASSETS: ${{ steps.assets.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
        run: |
          mkdir -p .ci
          {
            echo "Unilaw v7.2 observable CI"
            echo "toolchain=$TOOLCHAIN"
            echo "native=$NATIVE"
            echo "lineage=$LINEAGE"
            echo "assets=$ASSETS"
            echo "compile=$COMPILE"
            echo "commit=${GITHUB_SHA}"
            if [ -f /tmp/unilaw-v72-apk.sha256 ]; then cat /tmp/unilaw-v72-apk.sha256; fi
            if [ -f /tmp/unilaw-v72-badging.txt ]; then cat /tmp/unilaw-v72-badging.txt; fi
            if [ "$COMPILE" != "success" ] && [ -f /tmp/unilaw-v72-build.log ]; then
              echo "--- last build lines ---"
              tail -n 220 /tmp/unilaw-v72-build.log
            fi
          } > .ci/unilaw-v7-2-observable.txt
          git config user.name github-actions
          git config user.email actions@github.com
          git add .ci/unilaw-v7-2-observable.txt
          git commit -m "CI: record Unilaw v7.2 verification" || true
          git push origin HEAD:feature/unilaw-s21-firmware-tuned-v7-2
