name: Deploy Play Store Privacy Policy

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'playstore-site/**'
      - '.github/workflows/deploy-playstore-privacy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload privacy site
        uses: actions/upload-pages-artifact@v4
        with:
          path: playstore-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
