name: Repair v5 generated Kotlin escape

on:
  workflow_dispatch:
  push:
    branches: [ "feature/offline-ptbr-ai-persistent-projects-v5" ]
    paths:
      - '.github/workflows/repair-v5-patch-escape.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/offline-ptbr-ai-persistent-projects-v5
      - name: Double-escape live status newline in v5 transformer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_workspace_v5.py')
          s = p.read_text(encoding='utf-8')
          old = 'liveStatus.text = "$icon  $title\\n$detail"'
          new = 'liveStatus.text = "$icon  $title\\\\n$detail"'
          if old not in s:
              print('Already repaired or patch point changed')
          else:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('Repaired v5 transformer escape')
          PY
          git diff -- scripts/apply_workspace_v5.py
      - name: Commit repair if needed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply_workspace_v5.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix v5 generated Kotlin live status escape'
          git push origin HEAD:feature/offline-ptbr-ai-persistent-projects-v5
