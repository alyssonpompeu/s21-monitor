name: Build installable APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'last-successful-build.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk S21-CPU-GPU-Monitor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: S21-CPU-GPU-Monitor-APK
          path: S21-CPU-GPU-Monitor.apk

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: S21 CPU/GPU Monitor - Latest
          body: APK debug instalável gerado automaticamente a partir da branch main.
          files: S21-CPU-GPU-Monitor.apk
          make_latest: true
          overwrite_files: true

      - name: Record successful workflow run
        run: |
          printf '%s\n' "${GITHUB_RUN_ID}" > last-successful-build.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-successful-build.txt
          git commit -m "Record successful APK build [skip ci]" || exit 0
          git push
