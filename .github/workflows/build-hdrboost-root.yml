name: Build HDR Boost Root APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'hdrboost/**'
      - '.github/workflows/build-hdrboost-root.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build HDR Boost Root APK
        run: gradle :hdrboost:assembleDebug --stacktrace

      - name: Rename APK
        run: cp hdrboost/build/outputs/apk/debug/hdrboost-debug.apk HDR-Boost-S21-ROOT.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HDR-Boost-S21-ROOT-APK
          path: HDR-Boost-S21-ROOT.apk

      - name: Publish latest root APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hdrboost-root-latest
          name: HDR Boost S21 ROOT - Latest
          body: Root-first build for Galaxy S21. Applies Samsung Vivid, maximum framework brightness and compatible panel/HBM sysfs controls when exposed by the kernel. Real HDR remains content/compositor dependent.
          files: HDR-Boost-S21-ROOT.apk
          make_latest: false
          overwrite_files: true

      - name: Record successful HDR Boost build
        run: |
          printf '%s\n' "${GITHUB_RUN_ID}" > last-hdrboost-build.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-hdrboost-build.txt
          git commit -m "Record successful HDR Boost build [skip ci]" || exit 0
          git push
