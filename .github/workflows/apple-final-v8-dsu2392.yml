name: Build Apple Final V8 DSU2392 GPU Exp4 Experimental
on:
  workflow_dispatch:
  push:
    branches:
      - apple-final-v8-dsu2392-gpu-exp4-20261103
    paths:
      - 'apple-final/**'
      - '.github/workflows/apple-final-v8-dsu2392.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential cpio flex git libelf-dev libssl-dev python3 rsync unzip xz-utils lz4 brotli kmod zip ccache aria2 binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu
      - name: Validate V8 scripts
        run: python3 -m py_compile apple-final/apply_apple_v8_dsu2392_gpu_exp4.py
      - name: Build Apple Final V8 full kernel and matched vendor_boot DTBO
        shell: bash
        run: |
          set -o pipefail
          bash apple-final/build_apple_v8.sh 2>&1 | tee APPLE_FINAL_V8_BUILD.log
      - name: Upload V8 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APPLE-FINAL-V8-DSU2392-GPUEXP4-DIAGNOSTICS
          path: |
            APPLE_FINAL_V8_BUILD.log
            APPLE_FINAL_FLOPPY_README.txt
            APPLE_FINAL_FLOPPY_SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Upload V8 TWRP ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APPLE-FINAL-V8-DSU2392-GPUEXP4-TWRP
          path: src/build/Floppy_*Vanilla*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
