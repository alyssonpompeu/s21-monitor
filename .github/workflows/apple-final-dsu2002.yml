name: Build APPLE FINAL DSU 2002 MHz Experimental
on:
  push:
    branches:
      - apple-final-dsu2002-experimental-20261030
    paths:
      - 'apple-final/**'
      - '.github/workflows/apple-final-dsu2002.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential cpio flex git libelf-dev libssl-dev python3 rsync unzip xz-utils lz4 brotli kmod zip ccache aria2 binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu
      - name: Validate experimental DSU patch script
        run: python3 -m py_compile apple-final/apply_dsu2002_experimental.py
      - name: Build matched Floppy 5.4.304 kernel with Apple Final + DSU2002
        shell: bash
        run: |
          set -o pipefail
          bash apple-final/build_apple_final_resume.sh 2>&1 | tee APPLE_FINAL_DSU2002_BUILD.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APPLE-FINAL-DSU2002-BUILD-LOG
          path: |
            APPLE_FINAL_DSU2002_BUILD.log
            APPLE_FINAL_FLOPPY_README.txt
            APPLE_FINAL_FLOPPY_SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Upload TWRP experimental ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APPLE-FINAL-DSU2002-EXPERIMENTAL-TWRP
          path: src/build/Floppy_*Vanilla*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
