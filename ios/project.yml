name: Conversa5G
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Conversa5G:
    type: application
    platform: iOS
    sources:
      - path: Conversa5G
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alysson.conversa5g
        PRODUCT_NAME: Conversa5G
        INFOPLIST_FILE: Conversa5G/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    scheme:
      testTargets: []
