plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alysson.g533probe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alysson.g533probe'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
