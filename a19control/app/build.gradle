plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alysson.a19control'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alysson.a19control'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
