plugins {
    id 'com.android.application'
}
android {
    namespace 'com.alysson.appleocbench'
    compileSdk 35
    defaultConfig {
        applicationId 'com.alysson.appleocbench'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '2.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false }
}
